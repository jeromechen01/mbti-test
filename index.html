<!DOCTYPE html>
<html lang="zh-CN" :class="{ 'dark': darkMode }">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#16A34A" />
  <meta name="description" content="16 型人格测试 · 探索你的人格类型 · 中英双语 · 移动端友好" />
  <title>16 型人格测试 · 探索你的人格类型</title>

  <!-- Tailwind CSS（Play CDN） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary:   '#16A34A',
            secondary: '#EC4899',
            accent:    '#F59E0B'
          },
          borderRadius: { card: '16px', btn: '12px' },
          fontFamily: {
            sans: ['-apple-system','BlinkMacSystemFont','"PingFang SC"','"Microsoft YaHei"','sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- html2canvas（用于生成分享图） -->
  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>


  <!-- Supabase JS（注册登录 + 报告存储）。必须在 Alpine/inline 脚本之前同步加载，
       UMD 会挂到 window.supabase（含 createClient） -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <!-- 匹配排行榜 · 匹配度算法（纯函数，挂 window.MatchScore） -->
  <script src="match-score.js"></script>

  <style>
    :root {
      --primary:   #16A34A;
      --secondary: #EC4899;
      --accent:    #F59E0B;
    }
    [x-cloak] { display: none !important; }
    html { -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior: contain; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* 页面切换淡入 */
    .page-fade { animation: pageFade .35s ease-out; }
    @keyframes pageFade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    /* 结果页字母依次浮现 */
    .letter-reveal { display: inline-block; opacity: 0; animation: letterIn .7s ease-out forwards; }
    @keyframes letterIn {
      from { opacity: 0; transform: translateY(30px) scale(.8); }
      to   { opacity: 1; transform: none; }
    }
    /* 维度条游标 */
    .dim-marker {
      position: absolute; top: 50%;
      width: 18px; height: 18px; border-radius: 50%;
      background: white; border: 3px solid #1F2937;
      transform: translate(-50%, -50%);
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      transition: left .8s cubic-bezier(.4,0,.2,1);
    }
    .dark .dim-marker { background: #0f172a; border-color: white; }
    /* 锁定 Tab 遮罩 */
    .tab-locked-overlay {
      position: absolute; inset: 0;
      backdrop-filter: blur(6px);
      background: rgba(255,255,255,.55);
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      gap: 12px; z-index: 5; border-radius: 16px;
    }
    .dark .tab-locked-overlay { background: rgba(15,23,42,.55); }
    /* 横滚轴 */
    .horiz-scroll::-webkit-scrollbar { height: 6px; }
    .horiz-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 4px; }
    /* 加载页填充 */
    .loading-fill { transition: width 1s linear; }
    /* 16 型卡片 hover 高亮 */
    .type-cell { transition: transform .2s, box-shadow .2s; }
    .type-cell:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,.08); }
    /* ============ 灵魂版深度报告 ============ */
    /* 标语金句卡（hero 下方大字） */
    .deep-tagline-card {
      padding: 1.25rem 1.5rem;
      border-radius: 16px;
      font-style: italic;
      font-weight: 500;
      font-size: 1.25rem;
      line-height: 1.6;
      text-align: center;
      border: 1px solid rgba(0,0,0,.05);
    }
    @media (min-width: 640px) { .deep-tagline-card { font-size: 1.625rem; padding: 1.75rem 2rem; } }
    .dark .deep-tagline-card { border-color: rgba(255,255,255,.08); }

    /* 章节卡片 */
    .deep-chapter-card {
      position: relative;
      background: white;
      border-radius: 16px;
      padding: 1.5rem 1.5rem 1.5rem 1.75rem;
      margin-bottom: 1rem;
      border: 1px solid #E5E7EB;
      border-left: 4px solid #16A34A;
      transition: transform .2s, box-shadow .2s;
      overflow: hidden;
    }
    .dark .deep-chapter-card { background: rgb(30 41 59); border-color: rgba(255,255,255,.08); border-left-color: #818CF8; }
    .deep-chapter-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.06); }
    .deep-chapter-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%;
      background: #16A34A;
      color: white; font-weight: 700; font-size: 0.95rem;
      flex-shrink: 0;
    }
    .dark .deep-chapter-num { background: #818CF8; }
    .deep-chapter-title {
      font-size: 1.25rem; font-weight: 700; line-height: 1.3;
      color: #18181B;
    }
    .dark .deep-chapter-title { color: #F1F5F9; }
    .deep-chapter-label {
      font-size: 0.6875rem;
      color: #9CA3AF;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 500;
    }
    @media (min-width: 640px) { .deep-chapter-title { font-size: 1.5rem; } }
    .deep-chapter-content {
      font-size: 1rem; line-height: 1.85;
      color: rgb(55 65 81);
      white-space: pre-wrap;
      word-break: break-word;
    }
    @media (min-width: 640px) { .deep-chapter-content { font-size: 1.0625rem; } }
    .dark .deep-chapter-content { color: rgb(203 213 225); }

    /* 章节锁定遮罩 */
    .deep-chapter-locked-overlay {
      position: absolute; inset: 0;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,.78);
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      gap: 14px; border-radius: 16px;
      padding: 1.5rem; text-align: center;
    }
    .dark .deep-chapter-locked-overlay { background: rgba(15,23,42,.78); }

    /* 扎心金句卡（黑底白字） */
    .pain-quote-card {
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      color: white;
      padding: 2.25rem 1.5rem;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(15,23,42,.25);
    }
    .pain-quote-label {
      font-size: 0.75rem; letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,.5);
      margin-bottom: 0.75rem;
    }
    .pain-quote-text {
      font-size: 1.5rem; line-height: 1.55;
      font-weight: 600;
      font-style: italic;
    }
    @media (min-width: 640px) { .pain-quote-text { font-size: 2rem; } }

    /* 疗愈金句卡（金底深色） */
    .heal-quote-card {
      background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 100%);
      color: #1F2937;
      padding: 2.25rem 1.5rem;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 36px rgba(245,158,11,.25);
    }
    .heal-quote-label {
      font-size: 0.75rem; letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(31,41,55,.6);
      margin-bottom: 0.75rem;
    }
    .heal-quote-text {
      font-size: 1.5rem; line-height: 1.55;
      font-weight: 600;
    }
    @media (min-width: 640px) { .heal-quote-text { font-size: 2rem; } }

    /* ============ P3 AI 关系咨询 · 小满 ============ */
    .chat-container {
      display: flex; flex-direction: column;
      height: calc(100vh - 3.5rem);
      max-width: 768px; margin: 0 auto;
    }
    .chat-header {
      flex-shrink: 0;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(0,0,0,.06);
      background: white;
      display: flex; align-items: center; gap: 12px;
    }
    .dark .chat-header { background: rgb(30 41 59); border-color: rgba(255,255,255,.06); }
    .chat-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #C7D2FE, #818CF8);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    .chat-online-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #10B981; display: inline-block; margin-right: 4px;
      box-shadow: 0 0 6px rgba(16,185,129,.6);
    }
    .chat-messages {
      flex: 1; overflow-y: auto;
      padding: 1.25rem 1rem;
      background: #FAFAFA;
    }
    .dark .chat-messages { background: rgb(15 23 42); }
    .chat-bubble {
      max-width: 84%;
      padding: 0.875rem 1rem;
      border-radius: 16px;
      font-size: 0.95rem; line-height: 1.65;
      margin-bottom: 0.75rem;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .chat-bubble.user {
      background: #16A34A; color: white;
      border-bottom-right-radius: 4px;
      margin-left: auto;
    }
    .chat-bubble.assistant {
      background: white; color: #1F2937;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(0,0,0,.04);
    }
    .dark .chat-bubble.assistant { background: rgb(30 41 59); color: rgb(229 231 235); border-color: rgba(255,255,255,.06); }
    .chat-bubble strong { font-weight: 700; }
    .chat-meta {
      font-size: 0.7rem;
      color: #94A3B8;
      margin-bottom: 0.25rem;
      padding: 0 0.25rem;
    }
    .chat-meta.user { text-align: right; }
    .chat-typing {
      display: inline-flex; gap: 4px; align-items: center;
    }
    .chat-typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #9CA3AF;
      animation: typingPulse 1.2s infinite;
    }
    .chat-typing span:nth-child(2) { animation-delay: 0.2s; }
    .chat-typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingPulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }
    .chat-input-bar {
      flex-shrink: 0;
      padding: 12px;
      background: white;
      border-top: 1px solid rgba(0,0,0,.06);
      display: flex; gap: 8px; align-items: flex-end;
    }
    .dark .chat-input-bar { background: rgb(30 41 59); border-color: rgba(255,255,255,.06); }
    .chat-input {
      flex: 1;
      padding: 0.625rem 0.875rem;
      border: 1px solid rgba(0,0,0,.1);
      border-radius: 18px;
      background: #F8FAFC;
      font-size: 0.95rem;
      resize: none;
      max-height: 120px;
      min-height: 40px;
    }
    .dark .chat-input { background: rgb(15 23 42); border-color: rgba(255,255,255,.1); color: white; }

    /* AI 入口按钮（金色） */
    .ai-entry-btn {
      background: linear-gradient(135deg, #FCD34D, #F59E0B);
      color: #1F2937;
      border-radius: 14px;
      padding: 1rem 1.25rem;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 8px 24px rgba(245,158,11,.25);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .ai-entry-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(245,158,11,.35); }
    .ai-entry-btn .ai-avatar-sm {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,.5);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }

    /* 匹配加载页：阶段进度点 */
    .loading-phase-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(99,102,241,.3);
      transition: all .3s;
    }
    .loading-phase-dot.active {
      background: #16A34A;
      transform: scale(1.5);
    }

    /* 平衡型徽章 */
    .balanced-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(245,158,11,.15); color: #B45309;
      padding: 2px 8px; border-radius: 9999px; font-size: 11px; margin-left: 8px;
    }
    .dark .balanced-badge { background: rgba(245,158,11,.25); color: #FBBF24; }
  </style>
</head>

<body
  x-data="mbtiApp()"
  x-init="init()"
  x-cloak
  class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200"
>

  <!-- ============================== TOP NAV ============================== -->
  <nav class="sticky top-0 z-30 bg-white/85 dark:bg-slate-900/85 backdrop-blur border-b border-gray-100 dark:border-slate-800">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="#/home" @click.prevent="go('home')" class="flex items-center gap-2 font-bold text-primary">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2L2 7l10 5 10-5-10-5zm0 7L2 14l10 5 10-5-10-5z"/>
        </svg>
        <span x-text="t('siteName')">16 型人格测试</span>
      </a>
      <div class="flex items-center gap-1">
        <button @click="toggleLang()" class="px-2.5 py-1 rounded-btn text-sm hover:bg-gray-100 dark:hover:bg-slate-800 transition" :aria-label="t('a11y.toggleLang')">
          <span x-text="lang === 'zh' ? 'EN' : '中'">EN</span>
        </button>
        <button @click="toggleDark()" class="p-1.5 rounded-btn hover:bg-gray-100 dark:hover:bg-slate-800 transition" :aria-label="t('a11y.toggleDark')">
          <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          <svg x-show="darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
        <button @click="go('types')" class="p-1.5 rounded-btn hover:bg-gray-100 dark:hover:bg-slate-800 transition hidden sm:inline-flex" :aria-label="t('a11y.types')">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button @click="go('me')" class="p-1.5 rounded-btn hover:bg-gray-100 dark:hover:bg-slate-800 transition" :aria-label="t('a11y.me')">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- ============================== PAGE SLOTS ============================== -->
  <main class="max-w-5xl mx-auto">
    <!-- ============================== PAGE: HOME ============================== -->
    <div x-show="currentPage === 'home'" class="page-fade px-4 pt-6 sm:pt-10 pb-10">
      <!-- Hero -->
      <section class="text-center max-w-3xl mx-auto py-8 sm:py-14">
        <h1 class="text-3xl sm:text-5xl font-bold leading-tight mb-4" x-text="t('home.hero.title')">探索你的人格类型</h1>
        <p class="text-base sm:text-lg text-gray-600 dark:text-gray-300 mb-6" x-text="t('home.hero.subtitle')"></p>
        <button @click="beginTest('campus55')" class="inline-flex items-center justify-center gap-2 px-7 py-3 rounded-btn bg-primary text-white font-semibold shadow-lg shadow-primary/20 hover:shadow-xl transition" x-text="t('home.hero.cta')">立即开始</button>
        <p class="mt-4 text-xs text-gray-500 dark:text-gray-400" x-text="t('home.hero.note')"></p>
      </section>


      <!-- 测试版本选择：快测 / 深测 -->
      <section class="mt-6">
        <h2 class="text-center text-xl sm:text-2xl font-semibold mb-1" x-text="t('home.tiersTitle')"></h2>
        <p class="text-center text-sm text-gray-500 dark:text-gray-400 mb-8" x-text="t('home.tiersSubtitle')"></p>
        <div class="grid sm:grid-cols-2 gap-4 max-w-3xl mx-auto sm:items-stretch">
          <template x-for="tier in ['campus55','campus122']" :key="tier">
            <div class="bg-white dark:bg-slate-800 rounded-card p-6 border flex flex-col"
                 :class="tier==='campus55' ? 'border-2 border-primary sm:shadow-xl sm:shadow-primary/10' : 'border-gray-100 dark:border-slate-700'">
              <div class="flex items-center gap-2">
                <span class="text-sm font-medium" :class="tier==='campus55' ? 'text-primary' : 'text-gray-500 dark:text-gray-400'" x-text="t('home.tier.'+tier+'.name')"></span>
                <span x-show="tier==='campus55'" class="text-[10px] px-2 py-0.5 rounded-full bg-primary text-white" x-text="t('common.recommended')"></span>
              </div>
              <div class="font-semibold text-lg mt-0.5" x-text="t('home.tier.'+tier+'.subname')"></div>
              <p class="text-sm text-gray-600 dark:text-gray-300 mt-2 mb-3" x-text="t('home.tier.'+tier+'.desc')"></p>
              <ul class="text-sm text-gray-500 dark:text-gray-400 space-y-1.5 mb-5">
                <template x-for="f in t('home.tier.'+tier+'.features')" :key="f">
                  <li class="flex gap-2"><span class="text-primary">✓</span><span x-text="f"></span></li>
                </template>
              </ul>
              <div class="text-2xl font-bold mb-4 text-emerald-600 mt-auto" x-text="t('home.tier.'+tier+'.priceTag')"></div>
              <button @click="beginTest(tier)" class="w-full py-3 rounded-btn font-semibold transition"
                      :class="tier==='campus55' ? 'bg-primary text-white hover:opacity-90' : 'bg-gray-900 dark:bg-slate-700 text-white hover:bg-gray-800'"
                      x-text="t('home.tier.'+tier+'.cta')"></button>
            </div>
          </template>
        </div>
      </section>

      <!-- 匹配排行榜入口 -->
      <section class="mt-8">
        <div class="max-w-3xl mx-auto rounded-card p-6 text-white relative overflow-hidden cursor-pointer hover:shadow-xl transition" style="background: linear-gradient(135deg,#16A34A 0%,#0EA5E9 100%)" @click="openRanking()">
          <div class="relative z-10">
            <div class="text-xs uppercase tracking-widest opacity-80 mb-1" x-text="t('ranking.homeEntryKicker')"></div>
            <h3 class="text-2xl sm:text-3xl font-bold mb-2" x-text="t('ranking.homeEntryTitle')"></h3>
            <p class="text-sm opacity-90 mb-4 max-w-md" x-text="t('ranking.homeEntryDesc')"></p>
            <span class="inline-flex items-center px-4 py-2 rounded-btn bg-white text-emerald-700 font-semibold text-sm shadow" x-text="t('ranking.homeEntryCta')"></span>
          </div>
        </div>
      </section>

      <!-- 16 type preview wall -->
      <section class="mt-14">
        <h2 class="text-center text-xl sm:text-2xl font-semibold mb-1" x-text="t('home.typesTitle')"></h2>
        <p class="text-center text-sm text-gray-500 dark:text-gray-400 mb-6" x-text="t('home.typesSubtitle')"></p>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <template x-for="code in TYPE_ORDER" :key="code">
            <div @click="openType(code)" class="type-cell bg-white dark:bg-slate-800 rounded-card p-4 cursor-pointer border border-gray-100 dark:border-slate-700" :style="`border-top: 3px solid ${PERSONALITY_TYPES[code].themeColor}`">
              <div class="text-xs uppercase text-gray-400 tracking-wider" x-text="code"></div>
              <div class="font-semibold text-base mt-0.5" x-text="lang==='zh' ? PERSONALITY_TYPES[code].nameZh : PERSONALITY_TYPES[code].nameEn"></div>
              <div class="text-xs text-gray-500 dark:text-gray-400 mt-1.5 line-clamp-2" x-text="PERSONALITY_TYPES[code].tagline[lang]"></div>
            </div>
          </template>
        </div>
      </section>
    </div>

    <!-- ============================== PAGE: INTRO ============================== -->
    <div x-show="currentPage === 'intro'" class="page-fade px-4 pt-8 pb-10 max-w-2xl mx-auto">
      <button @click="go('home')" class="text-sm text-gray-500 dark:text-gray-400 hover:text-primary mb-6 flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span x-text="t('common.back')"></span>
      </button>
      <h1 class="text-2xl sm:text-3xl font-bold mb-1" x-text="t('intro.title')"></h1>
      <div class="text-base text-primary font-medium mb-6" x-text="t('home.tier.'+setCode+'.name') + ' · ' + t('home.tier.'+setCode+'.subname')"></div>

      <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-white dark:bg-slate-800 rounded-card p-4 border border-gray-100 dark:border-slate-700">
          <div class="text-xs text-gray-500 dark:text-gray-400" x-text="t('intro.questionsLabel')"></div>
          <div class="text-2xl font-bold mt-1"><span x-text="tierMeta(setCode).questions"></span><span class="text-sm font-normal text-gray-500 ml-1" x-text="t('common.questions')"></span></div>
        </div>
        <div class="bg-white dark:bg-slate-800 rounded-card p-4 border border-gray-100 dark:border-slate-700">
          <div class="text-xs text-gray-500 dark:text-gray-400" x-text="t('intro.durationLabel')"></div>
          <div class="text-2xl font-bold mt-1"><span x-text="tierMeta(setCode).duration"></span><span class="text-sm font-normal text-gray-500 ml-1" x-text="t('common.minutes')"></span></div>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-800 rounded-card p-5 border border-gray-100 dark:border-slate-700 mb-8">
        <div class="font-semibold mb-3" x-text="t('intro.beforeTitle')"></div>
        <ul class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
          <template x-for="(tip, i) in t('intro.tips')" :key="i">
            <li class="flex gap-2"><span class="text-primary mt-0.5">·</span><span x-text="tip"></span></li>
          </template>
        </ul>
      </div>

      <button @click="startActualTest()" class="w-full py-3.5 rounded-btn bg-primary text-white font-semibold text-base shadow-lg shadow-primary/20 hover:shadow-xl transition" x-text="t('intro.cta')"></button>

      <p class="text-xs text-gray-400 dark:text-gray-500 text-center mt-4" x-text="t('intro.minorNote')"></p>
    </div>

    <!-- ============================== PAGE: TEST ============================== -->
    <div x-show="currentPage === 'test'" class="page-fade min-h-[calc(100vh-3.5rem)] flex flex-col">
      <!-- Sticky top bar: back + progress + counter -->
      <div class="sticky top-14 z-20 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-gray-100 dark:border-slate-800 px-4 py-3">
        <div class="max-w-2xl mx-auto flex items-center gap-3">
          <button @click="requestExitTest()" class="p-1 -ml-1 text-gray-500 dark:text-gray-400 hover:text-primary" :aria-label="t('test.exitBtn')">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
          <div class="flex-1">
            <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 mb-1">
              <span x-text="t('test.questionOf', { i: currentQuestionIdx + 1, n: totalQuestions })"></span>
              <span x-text="Math.round(((currentQuestionIdx) / totalQuestions) * 100) + '%'"></span>
            </div>
            <div class="h-1.5 bg-gray-200 dark:bg-slate-700 rounded-full overflow-hidden">
              <div class="h-full bg-primary transition-all duration-300" :style="`width: ${(currentQuestionIdx / totalQuestions) * 100}%`"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Question -->
      <div class="flex-1 flex flex-col justify-center max-w-2xl mx-auto w-full px-6 py-10">
        <p class="text-center text-xl sm:text-2xl leading-relaxed font-medium" x-text="currentQuestion ? currentQuestion.text[lang] : ''"></p>
      </div>

      <!-- 5 级量表 + 上一题 -->
      <div class="border-t border-gray-100 dark:border-slate-800 bg-white dark:bg-slate-900 py-6 px-4">
        <div class="max-w-2xl mx-auto">
          <!-- 5 级量表：陈述句 + 认同程度（非常同意…非常不同意），选完自动进入下一题 -->
          <div class="space-y-2 max-w-md mx-auto mb-1">
            <template x-for="opt in [{v:2,dot:'bg-emerald-500'},{v:1,dot:'bg-emerald-300'},{v:0,dot:'bg-gray-300 dark:bg-slate-500'},{v:-1,dot:'bg-amber-300'},{v:-2,dot:'bg-rose-400'}]" :key="opt.v">
              <button @click="answer(opt.v)"
                      class="w-full py-3 px-4 rounded-btn border-2 text-sm font-medium transition flex items-center gap-3"
                      :class="currentAnswerValue === opt.v ? 'border-primary bg-primary/10 text-primary' : 'border-gray-200 dark:border-slate-700 text-gray-600 dark:text-gray-300 hover:border-primary/50'">
                <span class="w-3 h-3 rounded-full shrink-0" :class="opt.dot"></span>
                <span x-text="t('test.likertLabels')[2 - opt.v]"></span>
              </button>
            </template>
          </div>
          <div class="flex items-center justify-between text-xs text-gray-400 dark:text-gray-500">
            <button @click="prevQuestion()" :disabled="currentQuestionIdx === 0" class="px-3 py-1 rounded-btn hover:text-primary disabled:opacity-30 disabled:cursor-not-allowed flex items-center gap-1">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
              <span x-text="t('test.prevBtn')"></span>
            </button>
            <span x-text="t('test.autoSavedTip')"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- ============================== PAGE: LOADING ============================== -->
    <div x-show="currentPage === 'loading'" class="page-fade min-h-[calc(100vh-3.5rem)] flex flex-col items-center justify-center px-6">
      <div class="max-w-md w-full text-center">
        <!-- Spinner -->
        <div class="mx-auto w-16 h-16 mb-6 relative">
          <div class="absolute inset-0 rounded-full border-4 border-gray-200 dark:border-slate-700"></div>
          <div class="absolute inset-0 rounded-full border-4 border-primary border-t-transparent animate-spin"></div>
        </div>
        <h2 class="text-lg font-semibold mb-6" x-text="t('loading.title')"></h2>
        <div class="h-2 bg-gray-200 dark:bg-slate-700 rounded-full overflow-hidden mb-6 max-w-xs mx-auto">
          <div class="h-full bg-primary loading-fill" :style="`width: ${loadingPct}%`"></div>
        </div>
        <p class="text-sm text-gray-500 dark:text-gray-400 italic" x-text="'"' + (t('loading.tips')[loadingTipIdx] || '') + '"'"></p>
      </div>
    </div>

    <!-- ============================== PAGE: RESULT ============================== -->
    <div x-show="(currentPage === 'result' || currentPage === 'shared') && result" class="page-fade pb-12">
      <!-- 分享报告横幅 -->
      <template x-if="result && result.isShared">
        <div class="bg-emerald-50 dark:bg-emerald-900/20 border-b border-emerald-200 dark:border-emerald-800 px-4 py-2.5 text-center text-sm text-emerald-700 dark:text-emerald-300" x-text="t('report.sharedBanner')"></div>
      </template>
      <!-- Hero strip with type code + 灵魂版标语金句 -->
      <template x-if="result">
        <div :style="`background: linear-gradient(135deg, ${typeData(result.code).themeColor}33 0%, ${typeData(result.code).themeColor}0A 60%, transparent 100%)`" class="px-4 pt-10 pb-8">
          <div class="max-w-3xl mx-auto text-center">
            <div class="text-xs uppercase tracking-widest text-gray-500 dark:text-gray-400 mb-3" x-text="t('result.yourTypeLabel')"></div>
            <div class="text-5xl sm:text-7xl font-bold tracking-wider mb-3" :style="`color: ${typeData(result.code).themeColor}`">
              <template x-for="(ch, i) in result.code.split('')" :key="i">
                <span class="letter-reveal" :style="`animation-delay: ${i * 100}ms`" x-text="ch"></span>
              </template>
            </div>
            <div class="text-xl sm:text-2xl font-semibold mb-2" x-text="lang==='zh' ? typeData(result.code).nameZh : typeData(result.code).nameEn"></div>
            <p class="text-sm text-gray-600 dark:text-gray-300 max-w-md mx-auto mb-6" x-text="typeData(result.code).tagline[lang]"></p>

            <!-- 标语金句（仅当深度报告存在时显示） -->
            <template x-if="deepReport(result.code) && getQuote('taglineQuote')">
              <div class="max-w-xl mx-auto deep-tagline-card"
                   :style="`background: ${typeData(result.code).themeColor}1A; color: ${typeData(result.code).themeColor};`"
                   x-text="'「 ' + getQuote('taglineQuote') + ' 」'">
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ============== 搭子人设卡 ============== -->
      <template x-if="result && buddyMainTag()">
        <section class="max-w-3xl mx-auto px-4 mt-6">
          <div class="rounded-card p-6 text-center border border-gray-100 dark:border-slate-700" :style="`background: ${typeData(result.code).themeColor}12`">
            <div class="text-5xl mb-2" x-text="buddyMainTag().emoji"></div>
            <div class="text-xs text-gray-500 dark:text-gray-400 mb-1" x-text="t('buddy.mainLabel')"></div>
            <div class="text-2xl font-bold" :style="`color: ${typeData(result.code).themeColor}`" x-text="buddyMainTag()[lang].name"></div>
            <div class="text-sm text-gray-600 dark:text-gray-300 mt-1" x-text="buddyMainTag()[lang].line"></div>

            <!-- 场景副标签 -->
            <div class="flex flex-wrap justify-center gap-2 mt-4">
              <template x-for="st in sceneTags()" :key="st.key">
                <span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-sm bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700">
                  <span x-text="st.emoji"></span><span x-text="st[lang].name"></span>
                </span>
              </template>
            </div>
          </div>

          <!-- 搭子匹配 -->
          <template x-if="buddyMatches()">
            <div class="mt-4 grid sm:grid-cols-2 gap-3">
              <div class="rounded-card p-4 bg-white dark:bg-slate-800 border border-gray-100 dark:border-slate-700">
                <div class="text-sm font-semibold mb-3 text-emerald-600" x-text="t('buddy.bestLabel')"></div>
                <template x-for="b in buddyMatches().best" :key="b.code">
                  <div class="flex items-start gap-2 mb-3 last:mb-0">
                    <span class="text-xl shrink-0" x-text="b.emoji"></span>
                    <div class="min-w-0">
                      <div class="text-sm font-medium"><span x-text="b.name"></span> <span class="text-xs text-gray-400" x-text="b.code"></span></div>
                      <div class="text-xs text-gray-500 dark:text-gray-400" x-text="b.reason"></div>
                    </div>
                  </div>
                </template>
              </div>
              <div class="rounded-card p-4 bg-white dark:bg-slate-800 border border-gray-100 dark:border-slate-700">
                <div class="text-sm font-semibold mb-3 text-amber-600" x-text="t('buddy.clashLabel')"></div>
                <div class="flex items-start gap-2">
                  <span class="text-xl shrink-0" x-text="buddyMatches().clash.emoji"></span>
                  <div class="min-w-0">
                    <div class="text-sm font-medium"><span x-text="buddyMatches().clash.name"></span> <span class="text-xs text-gray-400" x-text="buddyMatches().clash.code"></span></div>
                    <div class="text-xs text-gray-500 dark:text-gray-400" x-text="buddyMatches().clash.reason"></div>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </section>
      </template>

      <!-- Dimensions -->
      <template x-if="result">
        <section class="max-w-3xl mx-auto px-4 mt-8">
          <h3 class="text-base font-semibold mb-4" x-text="result.useAT ? t('result.dimensionsTitleAT') : t('result.dimensionsTitle')"></h3>
          <div class="space-y-5 bg-white dark:bg-slate-800 rounded-card p-5 border border-gray-100 dark:border-slate-700">
            <template x-for="dim in (result.useAT ? ['EI','SN','TF','JP','AT'] : ['EI','SN','TF','JP'])" :key="dim">
              <div>
                <div class="flex items-center justify-between text-xs mb-1.5">
                  <span class="text-gray-500 dark:text-gray-400 font-medium" x-text="dimLabel(dim,'left')"></span>
                  <span>
                    <span class="font-semibold text-sm" x-text="result.dimensions[dim].side + ' ' + result.dimensions[dim].percentToSide.toFixed(0) + '%'"></span>
                    <span x-show="result.balanced[dim]" class="balanced-badge" x-text="t('result.balanced')"></span>
                  </span>
                  <span class="text-gray-500 dark:text-gray-400 font-medium" x-text="dimLabel(dim,'right')"></span>
                </div>
                <div class="relative h-2 bg-gradient-to-r from-gray-300 via-gray-200 to-primary dark:from-slate-600 dark:via-slate-700 dark:to-primary rounded-full">
                  <div class="dim-marker" :style="`left: ${result.dimensions[dim].positionPct}%`"></div>
                </div>
                <p x-show="result.balanced[dim]" class="text-xs text-amber-600 dark:text-amber-400 mt-1.5" x-text="t('result.balancedTip')"></p>
              </div>
            </template>
          </div>
        </section>
      </template>

      <!-- ============== 人格详细解读（快测/完整都显示；核心展开，其余折叠） ============== -->
      <template x-if="result && typeData(result.code)">
        <section class="max-w-3xl mx-auto px-4 mt-8">
          <h3 class="text-base font-semibold mb-4" x-text="t('result.detailTitle')"></h3>
          <div class="space-y-4">
            <!-- 核心特质（默认展开） -->
            <div class="bg-white dark:bg-slate-800 rounded-card p-5 border border-gray-100 dark:border-slate-700">
              <div class="text-sm font-semibold mb-2" :style="`color: ${typeData(result.code).themeColor}`" x-text="t('result.tabs.profile')"></div>
              <p class="text-sm leading-relaxed text-gray-700 dark:text-gray-200" x-text="typeData(result.code)[lang].profile"></p>
            </div>
            <!-- 优势 / 盲点 -->
            <div class="grid sm:grid-cols-2 gap-4">
              <div class="bg-white dark:bg-slate-800 rounded-card p-5 border border-gray-100 dark:border-slate-700">
                <div class="text-sm font-semibold mb-3 flex items-center gap-1.5"><span class="text-emerald-500">✦</span><span x-text="t('result.tabs.strengths')"></span></div>
                <ul class="space-y-1.5">
                  <template x-for="(s, i) in splitList(typeData(result.code)[lang].strengths)" :key="i">
                    <li class="text-sm text-gray-700 dark:text-gray-200 flex gap-2"><span class="text-emerald-500 mt-0.5">·</span><span x-text="s"></span></li>
                  </template>
                </ul>
              </div>
              <div class="bg-white dark:bg-slate-800 rounded-card p-5 border border-gray-100 dark:border-slate-700">
                <div class="text-sm font-semibold mb-3 flex items-center gap-1.5"><span class="text-amber-500">◆</span><span x-text="t('result.tabs.challenges')"></span></div>
                <ul class="space-y-1.5">
                  <template x-for="(s, i) in splitList(typeData(result.code)[lang].challenges)" :key="i">
                    <li class="text-sm text-gray-700 dark:text-gray-200 flex gap-2"><span class="text-amber-500 mt-0.5">·</span><span x-text="s"></span></li>
                  </template>
                </ul>
              </div>
            </div>
            <!-- 更多解读（默认折叠：亲密关系/友情/职业/工作/沟通） -->
            <template x-if="detailExpanded">
              <div class="space-y-4">
                <template x-for="f in [{k:'loveLanguage',l:'result.tabs.love'},{k:'friendship',l:'result.friendship'},{k:'career',l:'result.tabs.career'},{k:'workStyle',l:'result.tabs.work'},{k:'communication',l:'result.tabs.communication'}]" :key="f.k">
                  <div class="bg-white dark:bg-slate-800 rounded-card p-5 border border-gray-100 dark:border-slate-700">
                    <div class="text-sm font-semibold mb-2" :style="`color: ${typeData(result.code).themeColor}`" x-text="t(f.l)"></div>
                    <p class="text-sm leading-relaxed text-gray-700 dark:text-gray-200" x-text="typeData(result.code)[lang][f.k]"></p>
                  </div>
                </template>
              </div>
            </template>
            <button @click="detailExpanded = !detailExpanded" class="w-full py-2.5 rounded-btn border border-gray-200 dark:border-slate-700 text-sm text-gray-600 dark:text-gray-300 hover:border-primary transition" x-text="detailExpanded ? t('result.detailLess') : t('result.detailMore')"></button>
          </div>
        </section>
      </template>

      <!-- ============== 灵魂版深度报告：10 章卡片堆叠 + 金句 bookend（仅深测档） ============== -->
      <template x-if="result && isDeepTier() && deepReport(result.code)">
        <section class="max-w-3xl mx-auto px-4 mt-10">
          <!-- 章节区标题 -->
          <div class="mb-6 text-center">
            <h2 class="text-xl sm:text-2xl font-bold mb-1" :style="`color: ${typeData(result.code).themeColor}`" x-text="t('deepReport.sectionTitle')"></h2>
            <p class="text-sm text-gray-500 dark:text-gray-400" x-text="t('deepReport.sectionSubtitle')"></p>
            <p x-show="lang==='en'" class="text-xs text-amber-600 dark:text-amber-400 mt-2" x-text="t('deepReport.translationNote')"></p>
            <p class="text-xs text-gray-400 dark:text-gray-500 mt-3" x-text="t('deepReport.scrollHint')"></p>
          </div>

          <!-- 10 章节卡片 -->
          <template x-for="n in 10" :key="n">
            <article class="deep-chapter-card">
              <div class="flex items-center gap-3 mb-3">
                <div class="deep-chapter-num" x-text="String(n).padStart(2, '0')"></div>
                <div class="flex-1 min-w-0">
                  <div class="deep-chapter-label" x-text="t('deepReport.chapterPrefix') + ' ' + n + ' ' + t('deepReport.chapterSuffix')"></div>
                  <h3 class="deep-chapter-title" x-text="chapterTitle(n)"></h3>
                </div>
              </div>

              <!-- 解锁状态：渲染完整章节内容 -->
              <template x-if="!isChapterLocked(n)">
                <div class="deep-chapter-content" x-text="chapterContent(n)"></div>
              </template>

              <!-- 锁定状态：模糊预览 + 升级 CTA -->
              <template x-if="isChapterLocked(n)">
                <div class="relative">
                  <div class="deep-chapter-content" style="filter: blur(8px); user-select: none; pointer-events: none; max-height: 9em; overflow: hidden;" x-text="chapterContent(n).slice(0, 180) + '……'"></div>
                  <div class="deep-chapter-locked-overlay">
                    <svg class="w-10 h-10" :style="`color: ${typeData(result.code).themeColor}`" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <div>
                      <div class="font-bold text-base mb-1" x-text="chapterTier(n) === 'pro144' ? t('deepReport.lockTitlePro') : t('deepReport.lockTitleStandard')"></div>
                      <p class="text-sm text-gray-600 dark:text-gray-300 max-w-xs mx-auto" x-text="chapterTier(n) === 'pro144' ? t('deepReport.lockDescPro') : t('deepReport.lockDescStandard')"></p>
                    </div>
                    <button @click="go('paywall', { tier: chapterTier(n) })" class="px-5 py-2 rounded-btn text-white font-semibold text-sm shadow-md" :style="`background: ${typeData(result.code).themeColor}`" x-text="chapterTier(n) === 'pro144' ? t('deepReport.lockCtaPro') : t('deepReport.lockCtaStandard')"></button>
                  </div>
                </div>
              </template>
            </article>
          </template>

          <!-- 底部金句 bookend：扎心金句（黑底白字） + 疗愈金句（金底深色） -->
          <div class="mt-8 space-y-5">
            <div class="pain-quote-card" x-show="getQuote('painQuote')">
              <div class="pain-quote-label" x-text="t('deepReport.painLabel')"></div>
              <div class="pain-quote-text" x-text="'「 ' + getQuote('painQuote') + ' 」'"></div>
            </div>
            <div class="heal-quote-card" x-show="getQuote('healQuote')">
              <div class="heal-quote-label" x-text="t('deepReport.healLabel')"></div>
              <div class="heal-quote-text" x-text="'「 ' + getQuote('healQuote') + ' 」'"></div>
            </div>
          </div>
        </section>
      </template>

      <!-- ============== 关系 / 名人 / 操作 / 免责声明 ============== -->
      <template x-if="result">
        <section class="max-w-3xl mx-auto px-4 mt-10">

          <!-- Compatible / challenging types -->
          <div class="grid sm:grid-cols-2 gap-4 mt-6">
            <div class="bg-white dark:bg-slate-800 rounded-card p-5 border border-gray-100 dark:border-slate-700">
              <div class="text-sm font-semibold mb-3 flex items-center gap-2">
                <span class="text-emerald-500">♥</span>
                <span x-text="t('result.compatibleTitle')"></span>
              </div>
              <div class="flex flex-wrap gap-2">
                <template x-for="code in typeData(result.code)[lang].compatibleTypes" :key="code">
                  <button @click="openType(code)" class="px-3 py-1.5 rounded-btn text-sm font-medium bg-emerald-50 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-100 transition" :style="`border-left: 3px solid ${(PERSONALITY_TYPES[code]||{}).themeColor}`">
                    <span x-text="code"></span> · <span x-text="lang==='zh' ? (PERSONALITY_TYPES[code]||{}).nameZh : (PERSONALITY_TYPES[code]||{}).nameEn"></span>
                  </button>
                </template>
              </div>
            </div>
            <div class="bg-white dark:bg-slate-800 rounded-card p-5 border border-gray-100 dark:border-slate-700">
              <div class="text-sm font-semibold mb-3 flex items-center gap-2">
                <span class="text-amber-500">⚡</span>
                <span x-text="t('result.challengingTitle')"></span>
              </div>
              <div class="flex flex-wrap gap-2">
                <template x-for="code in typeData(result.code)[lang].challengingTypes" :key="code">
                  <button @click="openType(code)" class="px-3 py-1.5 rounded-btn text-sm font-medium bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 hover:bg-amber-100 transition" :style="`border-left: 3px solid ${(PERSONALITY_TYPES[code]||{}).themeColor}`">
                    <span x-text="code"></span> · <span x-text="lang==='zh' ? (PERSONALITY_TYPES[code]||{}).nameZh : (PERSONALITY_TYPES[code]||{}).nameEn"></span>
                  </button>
                </template>
              </div>
            </div>
          </div>

          <!-- Famous people horizontal scroll -->
          <div class="mt-6">
            <div class="text-sm font-semibold mb-3" x-text="t('result.famousTitle')"></div>
            <div class="flex gap-3 overflow-x-auto horiz-scroll pb-3 -mx-4 px-4">

  <!-- ============================== HIDDEN / DIALOGS / SHARE-CANVAS ============================== -->
  <!-- 隐藏的分享画布：1080×1920，html2canvas 会截屏这一块 -->
  <div aria-hidden="true" style="position: absolute; left: -10000px; top: 0; width: 1080px; height: 1920px; pointer-events: none;">
    <div id="share-canvas"
         x-show="result"
         :style="`width:1080px; height:1920px; padding: 90px 90px; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1F2937; background: linear-gradient(160deg, ${result ? typeData(result.code).themeColor + '22' : '#16A34A22'} 0%, #ffffff 65%, ${result ? typeData(result.code).themeColor + '15' : '#16A34A15'} 100%);`">
      <template x-if="result">
        <div style="display: flex; flex-direction: column; height: 100%; min-height: 1740px;">
          <!-- header brand -->
          <div style="display: flex; align-items: center; gap: 20px;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="#16A34A"><path d="M12 2L2 7l10 5 10-5-10-5zm0 7L2 14l10 5 10-5-10-5z"/></svg>
            <div>
              <div style="font-size: 42px; font-weight: 800; line-height: 1.1;" x-text="t('siteName')"></div>
              <div style="font-size: 24px; color: #6b7280; margin-top: 4px;" x-text="t('brand')"></div>
            </div>
          </div>

          <!-- center: type + name + tagline + dim bars -->
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 0;">
            <div :style="`font-size: 260px; font-weight: 800; letter-spacing: 14px; line-height: 1; color: ${typeData(result.code).themeColor}; text-shadow: 0 6px 20px ${typeData(result.code).themeColor}33;`" x-text="result.code"></div>
            <div style="font-size: 76px; font-weight: 700; margin-top: 36px;" x-text="lang==='zh' ? typeData(result.code).nameZh : typeData(result.code).nameEn"></div>
            <div style="font-size: 34px; color: #4b5563; margin-top: 28px; line-height: 1.6; max-width: 800px;" x-text="'"' + typeData(result.code).tagline[lang] + '"'"></div>

            <!-- dimension bars -->
            <div style="margin-top: 80px; width: 760px; display: flex; flex-direction: column; gap: 28px;">
              <template x-for="dim in (result.useAT ? ['EI','SN','TF','JP','AT'] : ['EI','SN','TF','JP'])" :key="dim">
                <div>
                  <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 22px; color: #6b7280; margin-bottom: 10px;">
                    <span x-text="dimLabel(dim,'left')"></span>
                    <span style="font-weight: 700; color: #1f2937; font-size: 24px;" x-text="result.dimensions[dim].side + ' ' + result.dimensions[dim].percentToSide.toFixed(0) + '%'"></span>
                    <span x-text="dimLabel(dim,'right')"></span>
                  </div>
                  <div style="position: relative; height: 14px; background: linear-gradient(to right, #d1d5db, #e5e7eb, #16A34A); border-radius: 7px;">
                    <div :style="`position: absolute; top: -5px; left: ${result.dimensions[dim].positionPct}%; transform: translateX(-50%); width: 24px; height: 24px; border-radius: 50%; background: white; border: 4px solid #1f2937;`"></div>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- footer: QR + CTA -->
          <div style="display: flex; align-items: center; gap: 44px; border-top: 1px solid #e5e7eb; padding-top: 36px;">
            <div style="width: 220px; height: 220px; background: repeating-conic-gradient(#1F2937 0% 25%, #fff 0% 50%) 50% / 24px 24px; border-radius: 18px; border: 3px solid #e5e7eb; flex-shrink: 0;"></div>

              <div style="font-size: 22px; color: #6b7280; line-height: 1.5;">
                <div x-text="t('share.title')"></div>
                <div style="margin-top: 4px;">— <span x-text="t('siteName')"></span></div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>

      <div class="bg-white dark:bg-slate-800 rounded-card max-w-sm w-full p-6 max-h-[85vh] overflow-y-auto shadow-2xl">
        <!-- 头部 -->
        <div class="flex items-center gap-3 mb-4">

            <div class="text-xs text-gray-500 dark:text-gray-400 truncate"><span x-text="rankingDetail.mbti"></span> · <span x-text="rankingDetail.buddyTag"></span></div>
          </div>
          <button @click="rankingDetail=null" class="text-gray-400 hover:text-gray-600 text-2xl leading-none shrink-0">&times;</button>
        </div>
        <!-- 匹配度 -->
        <div class="text-center mb-5">
          <div class="text-5xl font-bold text-emerald-600"><span x-text="rankingDetail.score"></span>%</div>

        </div>

        <div class="space-y-2.5 mb-5">
          <template x-for="b in detailBreakdown()" :key="b.key">

              <div class="flex justify-between text-xs mb-1"><span class="text-gray-600 dark:text-gray-300" x-text="b.label"></span><span class="text-gray-400" x-text="b.score + ' / ' + b.max"></span></div>

        <template x-if="rankingDetail.sharedTags && rankingDetail.sharedTags.length">

            </div>
          </div>
        </template>
