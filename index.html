    /* ===== QUESTIONS · campus 二选一专业题库 ×122 =====
     * 122 题：EI25 / SN25 / TF24 / JP24 / AT24，全部大学校园场景，强制二选一。
     * 结构：{ id, dimension, direction, type:'word_pair'|'statement'|'scenario', zh:{q,a,b}, en:{q,a,b} }
     * direction=1 → 选A偏前字母(E/S/T/J/A)，选B偏后字母(I/N/F/P/T)；-1 反向。
     * 两档：campus122=全量(含AT+10章深度报告)；campus55=精选55题子集(见 _CAMPUS55_IDS)。计分引擎不变。 */
    window.CAMPUS_QUESTIONS = [
      /* 5级量表深度题库：陈述句 + 通用5级认同度。direction=1→陈述偏前字母(E/S/T/J/A)，认同→前；-1反向。 */
      // ===== EI（外向 E / 内向 I）· 25 =====
      { id:'c01', dimension:'EI', direction:1,  zh:{ statement:'连续赶了三天 due，终于熬到周末。室友拉你去新开的 livehouse，你确实也累了。但你发现，比起一个人窝着，投入到热闹的人群里反而更能让你回血。' }, en:{ statement:"After three days straight of deadlines, you've finally hit the weekend. Your roommate drags you to a new livehouse — and yeah, you're tired. But you notice that throwing yourself into a buzzing crowd recharges you more than curling up alone." } },
      { id:'c02', dimension:'EI', direction:-1, zh:{ statement:'社团一整天的招新摆摊结束，晚上大家约着去吃宵夜复盘。你那天其实聊得挺开心，但回到宿舍那一刻，你只想关上门、谁也不见，安安静静把电充回来。' }, en:{ statement:"After a full day running the club's recruitment booth, everyone heads out for a late supper to debrief. You actually had a good time talking all day — but the moment you're back in the dorm, all you want is to shut the door, see no one, and quietly recharge." } },
      { id:'c03', dimension:'EI', direction:1,  zh:{ statement:'小组讨论冷场了好一会儿，没人接话。那种沉默让你有点坐不住，你往往会是先开口、把话题重新带起来的那个人。' }, en:{ statement:"The group discussion has stalled and no one picks up the thread. The silence makes you a little restless, and you tend to be the one who speaks up first and gets the conversation rolling again." } },
      { id:'c04', dimension:'EI', direction:-1, zh:{ statement:'刚认识一个聊得来的新朋友，对方很热情、想天天约着玩。你也喜欢 TA，但你更习惯慢慢熟，给彼此留一点喘息和独处的空间。' }, en:{ statement:"You've just met someone you click with, and they're keen to hang out every day. You like them too — but you're more comfortable warming up slowly, leaving each of you some room to breathe and be alone." } },
      { id:'c05', dimension:'EI', direction:1,  zh:{ statement:'一个完全空着的周末，没人约、也没安排。这种时候你会有点发慌，比起自己宅着，你更想主动找人出去，哪怕只是随便逛逛吃吃。' }, en:{ statement:"A totally empty weekend — no plans, no one's asked you out. That actually makes you a bit antsy; rather than stay in by yourself, you'd sooner reach out to someone and go out, even just to wander and grab food." } },
      { id:'c06', dimension:'EI', direction:-1, zh:{ statement:'一场很热闹的生日聚会进行到一半，气氛正高。你玩得也开心，但中途你会悄悄溜到阳台或角落待几分钟，缓一口气再回去。' }, en:{ statement:"A lively birthday party is in full swing and you're enjoying it. Still, partway through you quietly slip out to the balcony or a corner for a few minutes to catch your breath before going back in." } },
      { id:'c07', dimension:'EI', direction:1,  zh:{ statement:'食堂打饭时碰到一个只是点头之交的同学，旁边正好有空位。你多半会主动招呼一起坐，边吃边聊对你来说毫不费劲。' }, en:{ statement:"At the canteen you run into a classmate you only nod to, and there's an open seat nearby. You'd probably just wave them over to sit together — chatting over a meal costs you no effort at all." } },
      { id:'c08', dimension:'EI', direction:-1, zh:{ statement:'班级大群里大家在七嘴八舌地刷消息。比起在群里活跃地接话，你其实更享受和一两个人单独深聊，能把一个话题聊到很深的那种。' }, en:{ statement:"The class group chat is buzzing with everyone piling on messages. Honestly, more than jumping into the group banter, you enjoy a one-on-one with one or two people, the kind where a single topic goes really deep." } },
      { id:'c09', dimension:'EI', direction:1,  zh:{ statement:'迎新晚会要临时找人上台带个破冰游戏，没人愿意。你会觉得"那我来吧"，站到一群陌生人面前张罗气氛，对你来说更多是兴奋而不是负担。' }, en:{ statement:"At the welcome night someone's needed to run an icebreaker on stage, and nobody volunteers. You think 'I'll do it' — standing before a crowd of strangers to get the energy going feels more like a thrill than a burden." } },
      { id:'c10', dimension:'EI', direction:-1, zh:{ statement:'结束了一整天的实习、见了不少人，回到出租屋你只想一个人安静待着。哪怕是最好的朋友发来语音邀约，你也想先婉拒，留这个晚上给自己。' }, en:{ statement:"After a full day of interning and meeting lots of people, back at your place you just want to be alone and quiet. Even when your closest friend sends a voice note inviting you out, you'd rather gently pass and keep the evening for yourself." } },
      { id:'c11', dimension:'EI', direction:1,  zh:{ statement:'去外地参加一个比赛，同行的都是不认识的人。一路上你不太会安静坐着，更可能主动跟旁边的人攀谈，很快就熟络起来。' }, en:{ statement:"You're traveling to a competition with a group of people you've never met. You're unlikely to just sit quietly the whole way — more likely you'll strike up a chat with whoever's next to you and warm up fast." } },
      { id:'c12', dimension:'EI', direction:-1, zh:{ statement:'连着两周社交满满、活动一场接一场之后，你明显感到被掏空。你需要给自己安排几天"谁都别找我"的独处，才能慢慢缓过来。' }, en:{ statement:"After two weeks packed with socializing, one event after another, you feel clearly drained. You need to schedule a few 'don't anyone reach out to me' days alone before you slowly bounce back." } },
      { id:'c13', dimension:'EI', direction:1,  zh:{ statement:'课间十分钟，大多数人都各自刷手机。你却更愿意凑过去和同学聊两句，哪怕只是闲扯，这种碎片化的互动让你觉得有意思。' }, en:{ statement:"During the ten-minute break, most people are off scrolling their phones. You'd rather lean over and chat with a classmate, even just small talk — these little bits of interaction feel enjoyable to you." } },
      { id:'c14', dimension:'EI', direction:-1, zh:{ statement:'小组开会，大家轮流发表想法。你不是不愿意说，而是更习惯先在脑子里把话理清楚、想周全了再开口，很少脱口而出。' }, en:{ statement:"In a group meeting everyone takes turns sharing ideas. It's not that you don't want to speak — you just prefer to sort it out clearly in your head and think it through before you talk, rarely just blurting things out." } },
      { id:'c15', dimension:'EI', direction:1,  zh:{ statement:'刷到一个本地的同好线下聚会，去的全是没见过的网友。你不太会犹豫，反而很期待这种认识一堆新朋友的场合。' }, en:{ statement:"You come across a local meetup for a hobby you love, full of online acquaintances you've never met in person. You don't really hesitate — in fact you look forward to this kind of chance to meet a whole bunch of new people." } },
      { id:'c16', dimension:'EI', direction:-1, zh:{ statement:'自习室里你更喜欢挑最角落、背对人流的位置。太开放、太多人来往的环境会让你分神，安静独处时你的效率反而最高。' }, en:{ statement:"In the study room you'd rather take the far corner with your back to the foot traffic. Too open a space with people coming and going pulls your focus — you're actually most productive alone and quiet." } },
      { id:'c17', dimension:'EI', direction:1,  zh:{ statement:'宿舍夜聊到一半大家都困了，话题快接不下去。你常常是那个还在抛新梗、把气氛重新点起来、聊到最后一个睡的人。' }, en:{ statement:"The late-night dorm chat is winding down and everyone's getting sleepy, the topics running thin. You're often the one still tossing out new jokes, reviving the mood, and the last to fall asleep." } },
      { id:'c18', dimension:'EI', direction:-1, zh:{ statement:'团建安排了一整天的集体游戏，从早到晚都要和人互动。你也能配合得很好，但心里其实一直在盼着它快点结束，好回去一个人歇着。' }, en:{ statement:"A team-building day is packed with group games, interacting with people from morning to night. You play along just fine, but inside you're quietly counting down to when it ends so you can go be alone and rest." } },
      { id:'c19', dimension:'EI', direction:1,  zh:{ statement:'排队买饭时前面的人和店员聊得火热。你不会觉得尴尬，反而很自然地也加入进去搭两句，跟陌生人闲聊对你毫无压力。' }, en:{ statement:"While queuing for food, the person ahead is chatting away with the vendor. You don't find it awkward — you naturally chime in too. Small talk with strangers puts no pressure on you at all." } },
      { id:'c20', dimension:'EI', direction:-1, zh:{ statement:'有件事要处理，可以打个电话三分钟搞定，也可以发消息慢慢说。你下意识更想发消息——能想清楚再回，比即时通话让你自在。' }, en:{ statement:"Something needs sorting out — a three-minute call would do it, or you could message back and forth. Your instinct is to message: being able to think before you reply feels more comfortable than a live call." } },
      { id:'c21', dimension:'EI', direction:1,  zh:{ statement:'你发了条朋友圈，半天没人回。这种"没回应"会让你有点空落落的，你挺在意身边有没有人一起分享、一起热闹。' }, en:{ statement:"You post something and for hours no one responds. That lack of reaction leaves you feeling a bit empty — you care quite a lot about having people around to share things and be lively with." } },
      { id:'c22', dimension:'EI', direction:-1, zh:{ statement:'一个人去看展、一个人吃饭、一个人旅行，对你来说不仅不孤单，反而很享受。能完全按自己的节奏走，让你觉得难得的自在。' }, en:{ statement:"Going to an exhibition alone, eating alone, traveling alone — to you that's not lonely at all, it's actually a pleasure. Moving entirely at your own pace feels like a rare kind of ease." } },
      { id:'c23', dimension:'EI', direction:1,  zh:{ statement:'刚转专业到一个新班级，谁都不认识。第一周你就主动加了好几个同学、约人一起吃饭，很快让自己融了进去。' }, en:{ statement:"You've just transferred into a new class where you know no one. In the first week you've already added several classmates and arranged meals together, fitting yourself in quickly." } },
      { id:'c24', dimension:'EI', direction:-1, zh:{ statement:'放长假回家，亲戚轮番来串门、问东问西。你嘴上应付得来，但几天热闹下来你就想躲出去，找个谁都不认识的咖啡馆一个人待半天。' }, en:{ statement:"Home for a long break, relatives keep dropping by and peppering you with questions. You manage the small talk, but after a few lively days you want to escape — to some café where nobody knows you and just be alone for a while." } },
      { id:'c25', dimension:'EI', direction:1,  zh:{ statement:'走进一个完全陌生的场合，比如一个跨校的工作坊。你不太需要预热，很快就能跟人聊开、找到话题，新环境让你更兴奋而不是紧张。' }, en:{ statement:"Walking into a totally unfamiliar setting — say a cross-campus workshop — you don't need much warming up. You can soon get talking and find topics; a new environment excites you more than it makes you nervous." } },
      // ===== SN（实感 S / 直觉 N）· 25 =====
      { id:'c26', dimension:'SN', direction:-1, zh:{ statement:'选修课二选一：一门"实用数据分析"，作业明确、给分稳定、能写进简历；另一门"科幻与未来想象"，没标准答案但脑洞大开。你心里更被后者那种"说不清有什么用、但很有意思"的课吸引。' }, en:{ statement:"Two electives, pick one: 'Practical Data Analysis' — clear work, steady grades, résumé-ready; or 'Sci-Fi & Futures Thinking' — no right answers but wildly imaginative. Something in you leans toward the latter — the kind of class that's 'hard to say what it's for, but fascinating.'" } },
      { id:'c27', dimension:'SN', direction:1,  zh:{ statement:'小组调研会上大家越聊越发散，开始畅想"要是把这个做成创业项目会怎样"。你听着也觉得有意思，但你更想先把眼前这份作业的要求、截止时间、评分标准，一条条落实清楚。' }, en:{ statement:"Your group's research meeting keeps drifting — people start dreaming up 'what if we turned this into a startup.' You enjoy hearing it, but what you really want first is to nail down, point by point, the actual requirements, the deadline, and how it's graded." } },
      { id:'c28', dimension:'SN', direction:-1, zh:{ statement:'听一场讲座，一周后你大多忘了具体的数据和案例，却清楚记得它给你的某种"整体感觉"和一两个引发联想的大方向。' }, en:{ statement:"A week after a lecture, you've mostly forgotten the specific figures and cases, but you clearly remember a certain overall 'feel' it gave you and one or two big directions that set your mind wandering." } },
      { id:'c29', dimension:'SN', direction:1,  zh:{ statement:'帮社团做一份活动方案，你最先动手的是把流程、预算、时间节点、需要的物资一项项列实。那些"能不能更有创意"的发散，你更愿意等框架稳了再说。' }, en:{ statement:"Drafting an event plan for your club, the first thing you tackle is laying out the steps, budget, timeline and supplies, item by item. The 'could it be more creative' brainstorming you'd rather save until the framework is solid." } },
      { id:'c30', dimension:'SN', direction:-1, zh:{ statement:'看完一部电影，朋友在聊画面和剧情哪段好看。你脑子里转的却是"导演到底想说什么"，那些隐喻和言外之意比情节本身更勾你。' }, en:{ statement:"After a film, your friends are discussing which scenes and plot bits were good. What's turning in your head, though, is 'what was the director really trying to say' — the metaphors and subtext hook you more than the plot itself." } },
      { id:'c31', dimension:'SN', direction:1,  zh:{ statement:'学一个新软件，你不太愿意先去研究它背后的"设计理念"。你更想跟着一份具体的教程，一步一步把它实际跑通，做出来了才踏实。' }, en:{ statement:"Learning new software, you're not keen to first study the 'design philosophy' behind it. You'd rather follow a concrete tutorial, get it actually working step by step — only once it runs do you feel settled." } },
      { id:'c32', dimension:'SN', direction:-1, zh:{ statement:'老师抛出一个开放问题，比如"如果大学没有期末考会怎样"。别人觉得这是空想，你却会越想越上头，一口气推演出好多种可能。' }, en:{ statement:"A teacher throws out an open question like 'what if university had no final exams.' Others treat it as idle fantasy, but you get more and more into it, spinning out a whole range of possibilities in one go." } },
      { id:'c33', dimension:'SN', direction:1,  zh:{ statement:'室友兴奋地讲一个"未来可能很赚钱"的点子，听起来很美好但还很虚。你不会泼冷水，但心里第一反应是"现在第一步具体怎么走、靠不靠谱"。' }, en:{ statement:"Your roommate excitedly pitches an idea that 'could make a lot of money someday' — sounds great but still very vague. You won't rain on it, but your first instinct is 'what's the concrete first step, and is it actually viable.'" } },
      { id:'c34', dimension:'SN', direction:-1, zh:{ statement:'同样一件小事，你常常能从它联想到一个更大的格局或某种规律。这种"以小见大、把点连成线"的过程，本身就让你觉得很享受。' }, en:{ statement:"From the same small event, you can often leap to a bigger picture or some underlying pattern. That process of 'seeing the large in the small, connecting dots into lines' is itself something you find enjoyable." } },
      { id:'c35', dimension:'SN', direction:1,  zh:{ statement:'记笔记的时候，你更相信亲手记下的具体细节——日期、原话、步骤、数字。那些"抽象框架"听着高级，但对你来说不如一个确凿的例子来得可靠。' }, en:{ statement:"When taking notes, you trust the concrete details you write down by hand — dates, exact words, steps, numbers. 'Abstract frameworks' sound impressive, but to you a solid example is more reliable." } },
      { id:'c36', dimension:'SN', direction:-1, zh:{ statement:'逛二手书摊，你的手会不自觉地伸向那些天马行空的科幻、哲学或脑洞类的书，而不是"三步学会某技能"那种实用工具书。' }, en:{ statement:"Browsing a used-book stall, your hand drifts toward the wild sci-fi, philosophy and big-idea titles rather than the 'master a skill in three steps' how-to guides." } },
      { id:'c37', dimension:'SN', direction:1,  zh:{ statement:'做一件事，你更看重它现在能不能落地、看不看得到结果。那种"说不清有什么用、但也许以后有意义"的事，你会先放一放。' }, en:{ statement:"With anything you take on, you care more about whether it's doable now and whether results are visible. The 'hard to say what it's for, but maybe meaningful down the line' stuff, you'd set aside for now." } },
      { id:'c38', dimension:'SN', direction:-1, zh:{ statement:'听别人陈述一个事实，你下意识就想往后多问一句"那这意味着什么"。比起信息本身，你更着迷于它背后的含义和可能性。' }, en:{ statement:"When someone states a fact, your instinct is to push one step further — 'so what does that mean?' More than the information itself, you're drawn to the meaning and possibilities behind it." } },
      { id:'c39', dimension:'SN', direction:1,  zh:{ statement:'准备一次旅行，你享受的是把交通、住宿、必去的点、预算都查清楚、安排妥当的过程。那种"到了再说、看缘分"的玩法会让你有点没底。' }, en:{ statement:"Planning a trip, what you enjoy is researching and arranging the transit, lodging, must-sees and budget until it's all clear. The 'figure it out when we get there, go with the flow' approach leaves you a bit uneasy." } },
      { id:'c40', dimension:'SN', direction:-1, zh:{ statement:'课上老师讲的是确凿的操作步骤，你却容易走神到一个完全不相关的念头上去——一个新点子、一种联想，常常在你最该专注的时候冒出来。' }, en:{ statement:"In class the teacher is walking through concrete steps, yet your mind easily drifts to something totally unrelated — a fresh idea, an association, often popping up right when you should be focusing." } },
      { id:'c41', dimension:'SN', direction:1,  zh:{ statement:'别人形容你，更可能用"靠谱、务实、做事踏实"这类词，而不是"有想法、有创意、点子多"。你自己也觉得前者更贴近真实的你。' }, en:{ statement:"When people describe you, they're more likely to reach for 'reliable, practical, grounded' than 'imaginative, creative, full of ideas.' And you feel the former fits the real you better." } },
      { id:'c42', dimension:'SN', direction:-1, zh:{ statement:'同样做一份小组 PPT，你更擅长、也更有兴趣的是想一个让人眼前一亮的主题和切入角度，而不是把已有的数据和事实整理得整整齐齐。' }, en:{ statement:"On the same group slideshow, what you're better at — and more interested in — is coming up with a striking theme and angle, rather than tidying up the existing data and facts." } },
      { id:'c43', dimension:'SN', direction:1,  zh:{ statement:'对你来说，"现在确实如此"的事实，比"以后可能会怎样"的设想更让你安心。还没发生、说不准的东西，你不太愿意提前在上面投入太多。' }, en:{ statement:"For you, 'how things actually are now' reassures you more than 'how they might turn out later.' You're reluctant to invest too much, too early, in things that haven't happened and aren't certain." } },
      { id:'c44', dimension:'SN', direction:-1, zh:{ statement:'装饰宿舍，你在意的不只是"好不好用、顺不顺手"，更是它有没有风格、能不能体现你的某种想法。一个能表达自己的空间对你很重要。' }, en:{ statement:"Decorating your dorm, you care not just about whether it's functional and handy, but whether it has style and reflects some idea of yours. A space that expresses you matters to you." } },
      { id:'c45', dimension:'SN', direction:1,  zh:{ statement:'面对一份新任务，你的第一反应是"现在能落地的第一步是什么"，而不是"它最终能变成什么样"。先迈出扎实的一步，比想得很远更让你安心。' }, en:{ statement:"Facing a new task, your first reaction is 'what's the concrete first step right now,' not 'what could this ultimately become.' Taking one solid step settles you more than thinking far ahead." } },
      { id:'c46', dimension:'SN', direction:-1, zh:{ statement:'你常常洗澡、走路或发呆的时候，脑子里会自己冒出一些新点子或奇怪的联想。这种没来由的灵感对你来说是种乐趣，而不是干扰。' }, en:{ statement:"In the shower, while walking, or zoning out, new ideas and odd associations just surface in your head on their own. These out-of-nowhere sparks are a pleasure to you, not a distraction." } },
      { id:'c47', dimension:'SN', direction:1,  zh:{ statement:'做项目你更愿意用过去验证过、确实管用的流程，按经验来最稳。那些"还没人走过、但也许更好"的新路子，你会更谨慎。' }, en:{ statement:"For projects you'd rather use a proven, tried-and-true workflow — going by experience is safest. The 'untrodden but maybe better' new approaches, you treat with more caution." } },
      { id:'c48', dimension:'SN', direction:-1, zh:{ statement:'比起把已经成型的方案打磨到极致，你更喜欢一开始那种到处冒想法、什么都还有可能的发散阶段。点子越多，你越来劲。' }, en:{ statement:"Rather than polishing a finished plan to perfection, you love the early stage where ideas pop up everywhere and anything's still possible. The more ideas, the more energized you get." } },
      { id:'c49', dimension:'SN', direction:1,  zh:{ statement:'读一本书或看一个故事，越是具体、画面感强的细节，你越觉得有意思。那些抽象的概念和大道理，反而容易让你提不起劲。' }, en:{ statement:"Reading a book or following a story, the more concrete and vivid the details, the more it grabs you. The abstract concepts and grand principles, by contrast, tend to leave you a bit flat." } },
      { id:'c50', dimension:'SN', direction:-1, zh:{ statement:'你对那些"未被验证的可能性"，往往比"已经确定的事实"更感兴趣。一件事还充满变数、还没有答案的时候，反而最能勾住你。' }, en:{ statement:"You're often more interested in 'unverified possibilities' than 'settled facts.' When something is still full of unknowns and has no answer yet, that's exactly when it hooks you most." } },
      // ===== TF（思考 T / 情感 F）· 24 =====
      { id:'c51', dimension:'TF', direction:-1, zh:{ statement:'室友半夜哭着来找你，翻来覆去说的都是情绪，没说清到底发生了什么。比起先帮她理清"问题出在哪、接下来怎么办"，你更想先紧紧抱住她，让她把情绪发泄完。' }, en:{ statement:"Your roommate comes to you in tears at midnight, circling around her feelings without ever explaining what happened. Rather than first helping her untangle 'what went wrong and what to do,' you'd rather just hold her tight and let her cry it all out." } },
      { id:'c52', dimension:'TF', direction:1,  zh:{ statement:'班委会要决定有限的活动经费给哪个项目：一个是你好朋友牵头的、但方案明显不够成熟；另一个是你不太熟的人做的、但确实更扎实。你发现自己还是会倾向于把票投给方案本身更站得住脚的那个。' }, en:{ statement:"The committee must decide which project gets the limited budget: one led by a close friend but clearly half-baked; the other from someone you barely know but genuinely more solid. You notice you'd still lean toward voting for whichever proposal holds up better on its own merits." } },
      { id:'c53', dimension:'TF', direction:-1, zh:{ statement:'朋友拿她熬夜做的作品来找你，明显很期待肯定。你确实看出几处问题，但话到嘴边你会先把优点说足、照顾好她的心情，问题再委婉地提。' }, en:{ statement:"A friend brings you the work she stayed up all night on, clearly hoping for praise. You do spot a few problems, but you'd lead with her strengths and mind her feelings first, raising the issues gently afterward." } },
      { id:'c54', dimension:'TF', direction:1,  zh:{ statement:'小组里有个组员一直在划水，眼看要拖垮进度。比起顾及他的面子绕着说，你更倾向于就事论事地把影响和后果讲清楚，该指出就指出。' }, en:{ statement:"One teammate keeps slacking and it's about to drag the whole project down. Rather than tiptoe around to save his face, you'd lean toward laying out the impact and consequences plainly — if it needs to be said, you say it." } },
      { id:'c55', dimension:'TF', direction:-1, zh:{ statement:'你在评奖评优时发现，自己很难只看冷冰冰的分数和规则。一个差一点点没够格、但你知道她很努力很不容易的同学，会让你忍不住想替她说句话。' }, en:{ statement:"During awards and evaluations, you find it hard to go purely by cold scores and rules. A classmate who just missed the cutoff but whom you know worked hard and had it rough — you can't help wanting to put in a word for her." } },
      { id:'c56', dimension:'TF', direction:1,  zh:{ statement:'和人争论一个观点，你最在意的是谁的论据更站得住脚，而不是会不会因此伤了和气。道理没讲清楚，气氛再融洽你也觉得不踏实。' }, en:{ statement:"In an argument over some point, what you care about most is whose reasoning holds up, not whether it strains the relationship. If the logic isn't clear, no amount of pleasant atmosphere settles you." } },
      { id:'c57', dimension:'TF', direction:-1, zh:{ statement:'当班委处理两个同学的矛盾，你的第一反应不是先去查清谁对谁错，而是先把两边的情绪都安抚下来，让大家心里都好受些。' }, en:{ statement:"As class rep handling a clash between two students, your first instinct isn't to establish who's right and wrong, but to ease both sides' emotions first and make everyone feel a bit better." } },
      { id:'c58', dimension:'TF', direction:1,  zh:{ statement:'被同学当面指出方案的漏洞，你更在意他说的到底有没有道理，而不是他的语气好不好。只要逻辑成立，措辞重一点你也能接受。' }, en:{ statement:"When a classmate points out a flaw in your plan to your face, you care more about whether what he said holds up than about how nicely he said it. As long as the logic stands, you can take a blunt delivery." } },
      { id:'c59', dimension:'TF', direction:-1, zh:{ statement:'一个温暖的故事和一个精妙的论证，更容易把你打动的是前者。哪怕逻辑上无懈可击，少了点人情味的东西，对你来说总缺了点什么。' }, en:{ statement:"Between a heartwarming story and an elegant argument, the one more likely to move you is the former. However airtight the logic, something that lacks human warmth always feels like it's missing something to you." } },
      { id:'c60', dimension:'TF', direction:1,  zh:{ statement:'给朋友建议，你的风格是理性地帮他把利弊一条条摆清楚，让他自己看明白该怎么选，而不是一味地共情、站在他那边附和。' }, en:{ statement:"When advising a friend, your style is to lay out the pros and cons rationally so he can see for himself what to choose, rather than simply empathizing and taking his side." } },
      { id:'c61', dimension:'TF', direction:-1, zh:{ statement:'看到不公平的事，你的第一下是先共情那个受委屈的人、心疼 TA，之后才慢慢去分析事情的来龙去脉。情绪上的反应总是比理性来得更快。' }, en:{ statement:"Seeing something unfair, your first response is to feel for the wronged person and ache for them; only later do you slowly analyze how it all came about. The emotional reaction always arrives before the rational one." } },
      { id:'c62', dimension:'TF', direction:1,  zh:{ statement:'做一个会影响别人的决定，"这会让谁失望、谁不好受"这件事，其实不太会左右你的最终判断。你更看重这个决定本身对不对、合不合理。' }, en:{ statement:"When making a decision that affects others, 'who'll be disappointed, who'll feel bad' doesn't really sway your final call. You weigh more whether the decision itself is right and reasonable." } },
      { id:'c63', dimension:'TF', direction:-1, zh:{ statement:'气氛和谐对你来说很重要。一旦小组里起了冲突、有人不开心，你会浑身不自在，甚至愿意自己先让一步，只为让关系重新顺起来。' }, en:{ statement:"Harmony matters a lot to you. The moment a clash breaks out in the group and someone's upset, you feel thoroughly uneasy — you'd even concede first yourself, just to smooth the relationship back over." } },
      { id:'c64', dimension:'TF', direction:1,  zh:{ statement:'室友想抄你的作业，理由是"就这一次、关系好通融一下"。你心里清楚这不太合适，比起抹不开面子答应，你更可能直接而坦白地拒绝。' }, en:{ statement:"Your roommate wants to copy your homework, reasoning 'just this once, we're close, cut me some slack.' You know it isn't really right; rather than caving to save face, you'd more likely decline directly and honestly." } },
      { id:'c65', dimension:'TF', direction:-1, zh:{ statement:'你能比较敏锐地察觉到别人情绪上的变化——谁今天有点低落、谁话里有话。光听语气，你常常就能猜出对方大概的心情。' }, en:{ statement:"You pick up fairly keenly on shifts in others' moods — who's a little down today, whose words carry an undertone. From tone alone, you can often guess roughly how someone's feeling." } },
      { id:'c66', dimension:'TF', direction:1,  zh:{ statement:'你比较能把感情和判断分开。哪怕是很喜欢、关系很好的人，当他的方案确实有问题时，你也能把"喜欢这个人"和"这件事不对"分得清清楚楚。' }, en:{ statement:"You're fairly able to separate feelings from judgment. Even with someone you like and are close to, when his plan really has problems, you keep 'I like this person' and 'this thing is wrong' clearly apart." } },
      { id:'c67', dimension:'TF', direction:-1, zh:{ statement:'你更欣赏那种善解人意、说话顾及别人感受的人。比起"有一说一、实事求是"的直接，你觉得温柔体贴的方式往往更能把事办好。' }, en:{ statement:"You admire people who are understanding and mind others' feelings when they speak. Over blunt 'call it as it is' directness, you find a gentle, considerate approach often gets things done better." } },
      { id:'c68', dimension:'TF', direction:1,  zh:{ statement:'你更希望被人记住的，是"靠谱、公正、讲道理"，而不是"温暖、好相处"。被尊重对你来说，比被喜欢更重要一些。' }, en:{ statement:"You'd rather be remembered as 'dependable, fair, reasonable' than as 'warm, easy to be around.' Being respected matters a bit more to you than being liked." } },
      { id:'c69', dimension:'TF', direction:-1, zh:{ statement:'帮同学改简历，你下意识会先肯定亮点、把好的地方夸到位，再委婉地提改进建议。直接圈出一堆问题这种方式，你觉得对人不太友好。' }, en:{ statement:"Helping a classmate with their résumé, your instinct is to affirm the strengths first and praise what's good, then suggest improvements gently. Bluntly circling a pile of problems feels a bit unkind to you." } },
      { id:'c70', dimension:'TF', direction:1,  zh:{ statement:'两个朋友吵架来找你评理。你更想做的是冷静地分清谁的道理更站得住，而不是先把两边都哄好、把事情糊弄过去。' }, en:{ statement:"Two friends fight and come to you to settle it. What you'd rather do is calmly sort out whose case holds up better, not just soothe both sides and paper the whole thing over." } },
      { id:'c71', dimension:'TF', direction:-1, zh:{ statement:'做选择前，你会习惯性地想一圈"这个决定会让身边的谁受影响、谁会因此难受"。别人的感受，常常是你权衡时绕不过去的一环。' }, en:{ statement:"Before deciding, you habitually run through 'who around me will this affect, who'll feel bad because of it.' Others' feelings are often a part of the equation you can't get around." } },
      { id:'c72', dimension:'TF', direction:1,  zh:{ statement:'有人讲一个观点，你下意识先做的是判断它前后是不是一致、逻辑站不站得住，而不是先去体会"他这么说是不是有什么难处"。' }, en:{ statement:"When someone makes an argument, what you instinctively do first is check whether it's internally consistent and whether the logic holds — not first sense 'maybe he's saying this because something's troubling him.'" } },
      { id:'c73', dimension:'TF', direction:-1, zh:{ statement:'群里有人发了条消息却被冷场、没人接。你会忍不住接一句、让 TA 不那么尴尬，哪怕那条消息本身你并没多大兴趣。' }, en:{ statement:"Someone drops a message in the group and it falls flat, no one picks it up. You can't help replying so they don't feel so awkward — even if the message itself didn't much interest you." } },
      { id:'c74', dimension:'TF', direction:1,  zh:{ statement:'你对一个人的"能力"往往比"人品好不好、暖不暖"更敏感。第一次合作，你会先注意 TA 靠不靠谱、做事行不行，而不是 TA 待人热不热情。' }, en:{ statement:"You tend to notice a person's competence before their warmth or character. On a first collaboration, you first clock whether they're dependable and get things done, rather than how warmly they treat people." } },
      // ===== JP（判断 J / 知觉 P）· 24 =====
      { id:'c75', dimension:'JP', direction:-1, zh:{ statement:'期末周还剩三门考试。看着空白的复习计划表，你没有马上排出详细安排，而是觉得"先看看状态，哪门紧就突击哪门"反而更适合你。' }, en:{ statement:"Finals week, three exams left. Staring at a blank study planner, you don't rush to map out a detailed schedule — instead it feels like 'see how it goes, cram whichever's most urgent' actually suits you better." } },
      { id:'c76', dimension:'JP', direction:1,  zh:{ statement:'和朋友计划毕业旅行，群里七嘴八舌、迟迟定不下来。你有点坐不住，索性自己开了个文档，把日期、预算、路线一项项列出来——先把框架定下来，心里才踏实。' }, en:{ statement:"Planning a grad trip with friends, the group chat is all over the place and nothing gets settled. You can't quite sit with that, so you open a doc and start listing dates, budget, route one by one — only once the framework's set do you feel at ease." } },
      { id:'c77', dimension:'JP', direction:1,  zh:{ statement:'拿到下学期的课表，你更可能当天就把每周怎么安排、什么时候自习、什么时候社团大致规划好，而不是"先放着，到时候再看"。' }, en:{ statement:"Once you get next term's timetable, you're more likely to rough out that very day how each week will go — when to study, when for clubs — rather than 'leave it for now and sort it out later.'" } },
      { id:'c78', dimension:'JP', direction:-1, zh:{ statement:'一件事没做完，有的人会一直惦记着、睡不踏实。你倒还好——做不完就先放着，你相信"船到桥头自然直"，到时候总有办法。' }, en:{ statement:"With an unfinished task, some people keep fretting and can't sleep well. You're fairly okay with it — if it's not done, you let it sit; you trust it'll 'sort itself out when the time comes.'" } },
      { id:'c79', dimension:'JP', direction:1,  zh:{ statement:'你的书桌和手机文件大多是分门别类、各有各的位置。东西摆得整齐、找得到，会让你做事的时候心里更有条理、更安定。' }, en:{ statement:"Your desk and phone files are mostly sorted into categories, each with its place. Things kept tidy and findable give you a clearer, steadier sense of order when you work." } },
      { id:'c80', dimension:'JP', direction:-1, zh:{ statement:'计划被临时打乱——小组作业要求突然改了。比起懊恼"安排全乱了"，你反而有点小兴奋，觉得换个思路说不定能做出更有意思的东西。' }, en:{ statement:"A plan gets upended — the group assignment's requirements suddenly change. Rather than being annoyed that 'the whole plan's a mess,' you feel a little spark of excitement, sensing a fresh angle might lead somewhere more interesting." } },
      { id:'c81', dimension:'JP', direction:1,  zh:{ statement:'报名一个活动或比赛，你多半会在离截止还早的时候就早早报好、准备妥当，很少拖到最后一刻才手忙脚乱地决定。' }, en:{ statement:"Signing up for an event or competition, you'll usually register early and get prepared well before the deadline, rarely leaving it to the last frantic moment to decide." } },
      { id:'c82', dimension:'JP', direction:-1, zh:{ statement:'你享受那种"事情还没定死、随时能变"的状态。计划留白让你觉得自由，排得太满反而会让你有点想逃。' }, en:{ statement:"You enjoy that 'nothing's locked in, anything can still change' state. Open space in your plans feels freeing; a too-packed schedule actually makes you want to bolt." } },
      { id:'c83', dimension:'JP', direction:1,  zh:{ statement:'你喜欢把一个大目标拆成一个个阶段、一步步打钩完成的感觉。看着进度条慢慢推满，对你来说是一种实实在在的满足。' }, en:{ statement:"You like breaking a big goal into stages and ticking them off one by one. Watching the progress bar slowly fill is a real, tangible satisfaction to you." } },
      { id:'c84', dimension:'JP', direction:-1, zh:{ statement:'临近 due 的压力下，你反而灵感最足、效率最高。那种"最后时刻爆发"的状态，对你来说常常是发挥得最好的时候。' }, en:{ statement:"Under last-minute deadline pressure, you're actually at your most inspired and productive. That 'final-hour burst' is often when you do your best work." } },
      { id:'c85', dimension:'JP', direction:1,  zh:{ statement:'约朋友出去玩，你常常是那个提前把时间、地点、路线都定好的人。心里有个清楚的安排，你才玩得放松、不至于走一步看一步。' }, en:{ statement:"On a hangout with friends, you're often the one who locks in the time, place and route ahead. With a clear plan in mind, you actually relax and enjoy it, rather than winging it step by step." } },
      { id:'c86', dimension:'JP', direction:-1, zh:{ statement:'周末早上醒来，你不太想立刻给这一天排个计划。更舒服的方式是看心情决定干什么，让一天自然地展开。' }, en:{ statement:"Waking up on a weekend morning, you'd rather not immediately plan out the day. The more comfortable way is to decide by mood and let the day unfold on its own." } },
      { id:'c87', dimension:'JP', direction:1,  zh:{ statement:'决定之后，你很少再回头反复改。一件事定下来了你就照着走，不太会一直惦记着"是不是还有更好的选择"。' }, en:{ statement:"Once you decide, you rarely keep going back to change it. With a thing settled, you stick to it and don't tend to dwell on 'maybe there's a better option.'" } },
      { id:'c88', dimension:'JP', direction:-1, zh:{ statement:'购物或选东西，你更喜欢逛着挑、遇到喜欢的就拿，而不是先列好清单、按需购买。计划得太死，反而少了点发现的乐趣。' }, en:{ statement:"Shopping or picking things out, you'd rather browse and grab whatever you like, than work off a list and buy only what's needed. Planning it too tightly drains some of the joy of discovery." } },
      { id:'c89', dimension:'JP', direction:1,  zh:{ statement:'做事之前你习惯先把框架和分工定清楚再开始。"边走边想、走到哪算哪"那种方式，会让你心里没底、不太踏实。' }, en:{ statement:"Before getting to work you like to settle the framework and the division of labor first. The 'figure it out as you go, see where you end up' way leaves you feeling unmoored and uneasy." } },
      { id:'c90', dimension:'JP', direction:-1, zh:{ statement:'临场发挥往往是你状态最好的时候。准备得太充分、把每一步都设计死，反而会让你有点放不开、少了点灵气。' }, en:{ statement:"Improvising is often when you're at your best. Being over-prepared, with every step designed in advance, actually makes you a bit stiff and dulls your spark." } },
      { id:'c91', dimension:'JP', direction:1,  zh:{ statement:'你习惯用日历、清单或表格来管理生活。没有这些"外部的秩序感"帮你托着，你会觉得有点失控、没安全感。' }, en:{ statement:"You rely on calendars, lists or spreadsheets to run your life. Without that 'external sense of order' holding things up, you feel a bit out of control and insecure." } },
      { id:'c92', dimension:'JP', direction:-1, zh:{ statement:'你手机里常常同时开着好几件没做完的事——几个项目、几个想法，没有一个真正收尾。这种"半成品同时推进"的状态对你很自然。' }, en:{ statement:"Your phone often has several unfinished things going at once — a few projects, a few ideas, none truly wrapped up. This 'several half-done things in parallel' state feels natural to you." } },
      { id:'c93', dimension:'JP', direction:1,  zh:{ statement:'你宁愿早点到机场慢慢等，也不想踩着点赶。做事留足 buffer、不到最后一刻，会让你心里安稳很多。' }, en:{ statement:"You'd rather get to the airport early and wait around than cut it fine. Leaving plenty of buffer and not running to the wire makes you feel a lot steadier." } },
      { id:'c94', dimension:'JP', direction:-1, zh:{ statement:'半路上看到更有意思的事，你经常会临时改变原本的路线或计划。比起一条道走到黑，你更享受这种被新鲜事物带着走的随性。' }, en:{ statement:"Spotting something more interesting along the way, you'll often change your route or plan on the spot. Over sticking rigidly to one path, you enjoy this spontaneity of being led by something new." } },
      { id:'c95', dimension:'JP', direction:1,  zh:{ statement:'你喜欢在事情开始前就把目标和时间节点钉死。一旦定下来，就照着推进、很少返工——这种确定感让你做事更有底气。' }, en:{ statement:"You like nailing down the goal and the timeline before anything starts. Once set, you push it forward and rarely backtrack — that sense of certainty makes you work with more confidence." } },
      { id:'c96', dimension:'JP', direction:-1, zh:{ statement:'死板的时间表会让你本能地抵触。哪怕是自己定的计划，只要排得太满、太硬，你反而越不想照着执行。' }, en:{ statement:"A rigid schedule makes you instinctively resist. Even a plan you set yourself, if it's too packed and too fixed, the less you actually want to follow it." } },
      { id:'c97', dimension:'JP', direction:1,  zh:{ statement:'一件事没收尾，你会一直惦记着，甚至影响睡眠。你更习惯"先把手头的事干完、画上句号"，再安心去做别的。' }, en:{ statement:"An unfinished thing nags at you, even affecting your sleep. You're more comfortable 'finishing what's in front of you and putting a period on it' before you can move on to anything else at ease." } },
      { id:'c98', dimension:'JP', direction:-1, zh:{ statement:'选课季，你更像那种看心情和当下兴趣、边选边定的人，而不是早早研究培养方案、把四年都排明白。计划留点弹性，你才自在。' }, en:{ statement:"During course selection, you're more the type who goes by mood and current interest, deciding as you go, rather than studying the program early and mapping out all four years. Leaving the plan some give is what feels right." } },
      // ===== AT（果敢 A / 起伏 T）· 24 ===== T端写成"在意/追求更好/敏锐"，A端写成"从容/稳"，两端都有尊严
      { id:'c99',  dimension:'AT', direction:-1, zh:{ statement:'小组展示里你负责的部分，被老师当众点出一个小问题。结束后同学都说"没事，没人会记得"，但那个画面在你脑子里反复回放，好几天放不下，心里一直想着"下次一定要做得更好"。' }, en:{ statement:"In your group presentation, the part you handled got a small flaw pointed out by the professor in front of everyone. Afterward classmates said 'it's fine, no one will remember,' but that moment keeps replaying for days — you can't quite let it go, always thinking 'next time I'll do it better.'" } },
      { id:'c100', dimension:'AT', direction:1,  zh:{ statement:'一次重要的答辩没发挥好，你也清楚有些地方本可以更好。但睡一觉之后你基本就翻篇了——更倾向于把它当成一次普通经验，调整一下下次再来，不会一直耿耿于怀。' }, en:{ statement:"You didn't do great in an important defense, and you know some parts could've been better. But after a night's sleep you've basically moved on — you tend to treat it as just one ordinary experience, adjust for next time, and not keep dwelling on it." } },
      { id:'c101', dimension:'AT', direction:-1, zh:{ statement:'同学一句不经意的评价，你可能会放在心上琢磨很久——"TA 是不是话里有别的意思"。别人随口的一句话，常常比你以为的更能牵动你。' }, en:{ statement:"An offhand remark from a classmate can stay with you, turning it over for a long while — 'did they mean something more by that?' A casual line from someone often moves you more than you'd expect." } },
      { id:'c102', dimension:'AT', direction:1,  zh:{ statement:'考砸了一门、或被人否定了一次，你当然也会失落，但这不太会动摇你对自己整体的判断。你心里清楚自己几斤几两，一次起伏说明不了什么。' }, en:{ statement:"Bombing an exam or getting shot down once does get you down, sure, but it doesn't really shake your overall read on yourself. You know your own worth, and one setback doesn't say much." } },
      { id:'c103', dimension:'AT', direction:-1, zh:{ statement:'重要的展示前一晚，你往往会反复演练、脑子里把可能出岔子的地方过了一遍又一遍。这份在意让你准备得格外充分，也让你那晚不太睡得着。' }, en:{ statement:"The night before a big presentation, you'll often rehearse over and over, running through every spot that might go wrong again and again. That care leaves you exceptionally well-prepared — and not sleeping much that night." } },
      { id:'c104', dimension:'AT', direction:1,  zh:{ statement:'你大体上对自己挺满意，不太需要靠别人的点赞和认可来确认自己的价值。别人怎么看是一回事，你心里自有一杆秤。' }, en:{ statement:"On the whole you're fairly content with yourself and don't much need others' likes and approval to confirm your worth. What people think is one thing; you have your own measure inside." } },
      { id:'c105', dimension:'AT', direction:-1, zh:{ statement:'身边的同学比你更优秀、更出彩时，你心里会暗暗较劲、有点不服气，也会忍不住拿自己去比。这股劲推着你往前，但也偶尔让你有点累。' }, en:{ statement:"When a classmate around you outshines you, a part of you quietly competes, a bit unwilling to be left behind, and you can't help measuring yourself against them. That drive pushes you forward, though now and then it wears you out." } },
      { id:'c106', dimension:'AT', direction:1,  zh:{ statement:'各人有各人的节奏——别人跑得快，不太会影响你的心情。你更愿意按自己的步调走，不太把同辈之间的比较放在心上。' }, en:{ statement:"Everyone has their own pace — others moving fast doesn't much affect your mood. You'd rather go at your own step and don't take peer comparisons much to heart." } },
      { id:'c107', dimension:'AT', direction:-1, zh:{ statement:'做完一份作业交上去后，你还会忍不住反复检查、担心是不是哪里有疏漏。这份谨慎让你很少出错，但也让你交出去之后还放不太下。' }, en:{ statement:"After handing in an assignment, you can't help re-checking it, worried you missed something. That carefulness means you rarely slip up — but it also means you can't quite let go even after it's submitted." } },
      { id:'c108', dimension:'AT', direction:1,  zh:{ statement:'做完一件事，你能比较心安理得地说"这就够好了"，然后放下。你不太会逼自己把每个细节都抠到极致，差不多到位就行。' }, en:{ statement:"Once something's done, you can fairly comfortably say 'this is good enough' and let it go. You don't tend to push yourself to perfect every detail — close enough is fine." } },
      { id:'c109', dimension:'AT', direction:-1, zh:{ statement:'收到一条没头没尾的"在吗"，你会忍不住先在脑子里转一圈"是不是出什么事了、是不是我哪里做得不好"，而不是淡定地回个"在"等下文。' }, en:{ statement:"Getting a vague 'you there?' text, you can't help first running through 'is something wrong, did I do something off?' rather than calmly replying 'yep' and waiting to hear more." } },
      { id:'c110', dimension:'AT', direction:1,  zh:{ statement:'当众说错了一句话，事后你笑笑也就过去了，很快忘掉。你不太会把这种小尴尬放在心上反复回放，翻篇对你来说挺容易。' }, en:{ statement:"After misspeaking in public, you laugh it off and it passes; you forget it fast. You don't tend to dwell on that kind of small awkwardness and replay it — moving on comes easily to you." } },
      { id:'c111', dimension:'AT', direction:-1, zh:{ statement:'即使这次做得不错，你心里也会冒出"下次会不会掉链子"的隐隐担忧。你对自己要求高，很难真正放松地享受"做得好"这件事。' }, en:{ statement:"Even after doing well, a faint worry surfaces — 'what if I drop the ball next time.' You hold yourself to a high bar and find it hard to truly relax and savor having done well." } },
      { id:'c112', dimension:'AT', direction:1,  zh:{ statement:'目标没达成时，你能比较快地接受现实、调整预期，然后继续往前走。你不太会长时间陷在"是不是我不够努力"的自责里。' }, en:{ statement:"When a goal falls short, you can fairly quickly accept it, adjust your expectations, and move on. You don't tend to get stuck for long in 'maybe I didn't try hard enough' self-blame." } },
      { id:'c113', dimension:'AT', direction:-1, zh:{ statement:'你心里常常藏着一个"我够不够好"的问号，所以总在不停地推着自己更努力。这份不安是你前进的一部分动力，也是你内耗的来源。' }, en:{ statement:"There's often a 'am I good enough' question mark tucked in your mind, so you keep pushing yourself to try harder. That unease is part of what drives you forward — and part of what churns you up inside." } },
      { id:'c114', dimension:'AT', direction:1,  zh:{ statement:'你的情绪起伏不算大，大体上比较稳。外界的风吹草动、别人的态度变化，不太容易把你的心情带跑。' }, en:{ statement:"Your moods don't swing much; on the whole you're fairly steady. The little stirrings around you and shifts in others' attitudes don't easily carry your mood away." } },
      { id:'c115', dimension:'AT', direction:-1, zh:{ statement:'你比较容易被身边人的情绪感染——朋友难过，你也会跟着低落好一阵。这份敏感让你很会共情，但也让你更容易被外界牵动。' }, en:{ statement:"You're fairly easily affected by the moods of those around you — when a friend is down, you sink with them for a while. That sensitivity makes you good at empathy, but also more easily swayed by what's around you." } },
      { id:'c116', dimension:'AT', direction:1,  zh:{ statement:'面对一件没多大把握的事，你倾向于先干起来，边做边找感觉、慢慢有底。你不太会在开始前就被"万一搞砸了"的担心拖住。' }, en:{ statement:"Facing something you're not sure of, you tend to just start, finding your footing and building confidence as you go. You're not easily held back by 'what if I mess it up' before you even begin." } },
      { id:'c117', dimension:'AT', direction:-1, zh:{ statement:'别人怎么看你，你其实挺在意。一句肯定能让你高兴半天，一句质疑也可能让你反复琢磨——外界的反馈对你的状态影响不小。' }, en:{ statement:"You do care quite a bit how others see you. A word of affirmation can lift you for half a day, and a hint of doubt can have you turning it over and over — outside feedback affects your state quite a lot." } },
      { id:'c118', dimension:'AT', direction:1,  zh:{ statement:'高压的时刻——比如答辩、面试、关键比赛——你大体上能稳得住，不至于慌。压力之下你反而能比较清醒地把该做的做完。' }, en:{ statement:"In high-pressure moments — a defense, an interview, a key competition — you can largely hold steady and not panic. Under pressure you can actually stay fairly clear-headed and get the necessary things done." } },
      { id:'c119', dimension:'AT', direction:-1, zh:{ statement:'高压周里，几件事一起压过来，你容易陷入焦虑，晚上也睡不太安稳。你会把很多还没发生的"万一"提前在心里演练一遍又一遍。' }, en:{ statement:"In a high-pressure week, when several things pile on at once, you slip into anxiety and don't sleep too soundly. You rehearse, again and again, a lot of 'what ifs' that haven't even happened yet." } },
      { id:'c120', dimension:'AT', direction:1,  zh:{ statement:'做完一个决定，你很少再反复后悔"早知道选另一个就好了"。定了就定了，回头看也坦然，这种事过后你睡得挺安稳。' }, en:{ statement:"Once you've made a decision, you rarely keep regretting 'I should've picked the other one.' Decided is decided; you look back with ease, and you sleep just fine afterward." } },
      { id:'c121', dimension:'AT', direction:-1, zh:{ statement:'你对自己有种"还能更好"的较真——一份明明不错的作业，你也会盯着那个还能优化的小地方，很难真正说服自己"到此为止"。' }, en:{ statement:"You have a 'this could be better' exactingness toward yourself — even with a perfectly good assignment, you'll fixate on the one spot that could still be improved, and find it hard to truly tell yourself 'that's enough.'" } },

        en:{
          profile:'Advocates are a rare and paradoxical pair: the foresight of N and the warmth of F. You sense undercurrents others miss and will go out of your way for a stranger\'s pain. Your introversion isn\'t avoidance — it\'s observation. You appear gentle, but the core is quietly unshakable.',

          profile:'A Mediator\'s world is built on values. You don\'t care if you appear "professional"; you care intensely whether something is "worthy of you." A poet and a guardian live in you — you\'ll cry at a song, and you\'ll dig in immovably against an injustice.',

    /* ============================== ENGINE ==============================
     * 计分 · 解锁码（SubtleCrypto SHA-256）· 路由 · localStorage · 全局状态
     * ================================================================== */

    /**
     * 计分引擎：将答案集计算成 MBTI 报告对象
     * @param {Object} answers - { q001: -2..+2, q002: -2..+2, ... }
     * @param {string} setCode - 'quick28' | 'standard93' | 'pro144'
     * @returns 完整结果对象
     */
    function calculateMBTI(answers, setCode) {
      const questions = window.QUESTIONS[setCode];
      const dims = ['EI','SN','TF','JP'];
      // useAT 数据驱动：题库里实际含 AT 题才计 AT 维度（计分公式不变）
      const useAT = Array.isArray(questions) && questions.some(q => q && q.dimension === 'AT');
      if (useAT) dims.push('AT');

      // 1) 累计每维度的原始分 & 该维度最大可能绝对值
      const raw = {}, maxAbs = {};
      dims.forEach(d => { raw[d] = 0; maxAbs[d] = 0; });
      for (const q of questions) {
        if (!dims.includes(q.dimension)) continue;
        const ans = answers[q.id];
        if (typeof ans !== 'number') continue;
        raw[q.dimension] += ans * q.direction * q.weight;
        maxAbs[q.dimension] += 2 * Math.abs(q.weight);
      }

      // 2) 归一化到 [-100, +100]
      const dimensions = {};
      const balanced = {};
      const letters = { EI:'', SN:'', TF:'', JP:'', AT:'' };
      const SIDE_MAP = {
        EI: { pos: 'E', neg: 'I' },
        SN: { pos: 'N', neg: 'S' },
        TF: { pos: 'T', neg: 'F' },
        JP: { pos: 'P', neg: 'J' },
        AT: { pos: 'A', neg: 'T' }
      };
      dims.forEach(d => {
        const norm = maxAbs[d] === 0 ? 0 : Math.round(raw[d] / maxAbs[d] * 100);
        // 边界规则：norm > 0 → 后字母（E/N/T/P/A）；norm <= 0（含 0）→ 前字母（I/S/F/J/T）
        // 全中立（norm=0）默认归到前字母一侧，符合"未表态时倾向稳态"的预期。
        const side = norm > 0 ? SIDE_MAP[d].pos : SIDE_MAP[d].neg;
        const percentToSide = 50 + Math.abs(norm) / 2;   // 50..100
        const positionPct = ((norm + 100) / 200) * 100;  // 0..100, 用于游标 left%
        dimensions[d] = { score: norm, side, percentToSide, positionPct };
        balanced[d] = Math.abs(norm) < 5;
        letters[d] = side;
      });

      // 3) 拼接类型代码
      const fourLetter = letters.EI + letters.SN + letters.TF + letters.JP;
      const code = useAT ? `${fourLetter}-${letters.AT}` : fourLetter;

      return {
        code, baseCode: fourLetter, useAT,
        atSuffix: useAT ? letters.AT : null,
        dimensions, balanced, setCode,
        timestamp: Date.now()
      };
    }

    /* ---------- LocalStorage 持久化 ---------- */
    const LS_KEY = 'mbti_app_state';

    function loadState() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }
    function saveState(patch) {
      try {
        const cur = loadState() || {};
        const next = { ...cur, ...patch };
        localStorage.setItem(LS_KEY, JSON.stringify(next));
      } catch (e) { /* quota or private mode — silently ignore */ }
    }
    function saveDeep(key, value) { saveState({ [key]: value }); }

    /* ---------- 主 Alpine 组件 ---------- */
    function mbtiApp() {
      return {
        /* ===== UI 状态 ===== */
        currentPage: 'home',
        pageParams: {},
        lang: 'zh',
        darkMode: false,
        dialog: { open: false, message: '', onOk: null, onCancel: null },

        currentQuestions: [],
        currentQuestionIdx: 0,
        answers: {},                  // { qId: -2..+2 }
        testStartedAt: 0,

        /* ===== 加载页 ===== */
        loadingPct: 0,
        loadingTipIdx: 0,
        loadingTimer: null,

        /* ===== 结果页 ===== */
        result: null,
        activeTab: 'profile',
        detailExpanded: false,   // 结果页「人格详细解读」更多段落折叠
        sharing: false,

        /* ===== 解锁状态（仅 AI 顾问） ===== */
        unlocked: { ai: false },

        /* ===== 类型详情页 ===== */
        viewingTypeCode: 'INTJ',

        /* ===== P3 AI 关系咨询（小满） ===== */
        aiEnabled: false,          // 小满入口总开关：暂时隐藏 UI（代码全保留，将来翻 true 即恢复）
        // ⚠️ 部署 Cloudflare Worker 后，把下面这个 URL 替换为你自己的 Worker 域名
        aiWorkerUrl: 'https://mbti-ai-proxy.your-account.workers.dev/chat',
        aiUnlockCode: '',          // 用户解锁 AI 后从 unlockInput 写入，发请求时带上
        aiMessages: [],            // [{ role: 'user'|'assistant', content, ts }]
        aiInput: '',
        aiSending: false,          // 流式响应中
        aiStreamingBuf: '',        // 当前流式响应累积缓冲（用于显示）
        aiErrorMsg: '',
        aiContext: { from: null }, // 'report' | 'matching' | 'me' — 从哪进入

        /* ===== 个人中心 ===== */
        history: [],
        compareMode: false,
        compareIds: [],

        /* ===== 用户 ===== */
        user: null,                   // { id, email, joinedAt }
        authMode: 'login',          // 'login' | 'register'
        authLoading: false,
        /* 登录 */
        authPhone: '',
        authPassword: '',
        /* 注册 */
        regName: '',
        regBirthYear: '', regBirthMonth: '', regBirthDay: '',
        regProvince: '', regCity: '',
        regPhone: '',
        regPassword: '',
        regConfirm: '',
        regAgree: false,

        /* ===== 报告查询 / 云端 ===== */
        cloudReports: [],
        cloudLoading: false,
        queryCode: '',
        sharedLoading: false,
        sharedNotFound: false,

        /* ===== 个人资料 / 匹配排行榜 ===== */
        profile: { nickname: '', city: '', province: '', base_code: '', mbti_code: '', buddy_tag: '', scene_tags: [] },
        profileLoaded: false,
        profileSaving: false,
        ranking: [],
        rankingLoading: false,
        rankingChannel: null,       // Supabase Realtime 订阅（步骤3）
        rankingRefreshTimer: null,  // 实时刷新防抖
        rankingDetail: null,        // 匹配详情弹窗（步骤4）

        /* ===== 关于页 tab ===== */
        aboutTab: 'about',

        /* ===== 类型分组常量 ===== */
        TYPE_GROUPS: window.TYPE_GROUPS,
        TYPE_ORDER: window.TYPE_ORDER,

        /* =========================================================
         * 生命周期
         * ======================================================= */
        init() {
          // 恢复持久化状态
          const s = loadState();
          if (s) {
            this.lang = s.lang || this.detectLang();
            this.darkMode = (typeof s.darkMode === 'boolean') ? s.darkMode : this.detectDark();
            // 合并 unlocked 而不是替换，确保新增 tier（如 ai）在旧用户那里也存在
            this.unlocked = Object.assign({}, this.unlocked, s.unlocked || {});
            // user 由 Supabase 会话恢复（见 restoreSession），不再从 localStorage 读
            this.history = s.history || [];
            // P3 AI 状态恢复
            this.aiUnlockCode = s.aiUnlockCode || '';
            this.aiMessages = Array.isArray(s.aiMessages) ? s.aiMessages : [];
            // 恢复未完成的测试（仅当题库仍存在；老版本 quick28/pro144 进度自动失效，避免白屏）
            if (s.testInProgress && window.QUESTIONS[s.testInProgress.setCode]) {
              this.setCode = s.testInProgress.setCode;
              this.currentQuestionIdx = s.testInProgress.currentQuestionIdx || 0;
              this.answers = s.testInProgress.answers || {};
              this.testStartedAt = s.testInProgress.testStartedAt || Date.now();
            } else if (s.testInProgress) {
              // 丢弃失效进度
              this.setCode = 'campus55';
            }
          } else {
            this.lang = this.detectLang();
            this.darkMode = this.detectDark();
          }

          // 路由
          window.addEventListener('popstate', () => this.handleHash(true));
          this.handleHash(false);

          // 深链直达：分享报告页首屏加载（handleHash(false) 不触发 onPageEnter）
          if (this.currentPage === 'shared') this.loadSharedReport(this.pageParams.code);

          // 恢复 Supabase 登录会话（异步，不阻塞首屏）
          this.restoreSession();

          // 系统暗色模式变化时同步（仅当用户未手动设置过）
          if (window.matchMedia && !s) {
            window.matchMedia('(prefers-color-scheme: dark)')
              .addEventListener('change', e => { this.darkMode = e.matches; });
          }
        },

        detectLang() {
          // 强制默认中文（这是中文产品）。用户主动切换 EN 后会写入 localStorage，
          // 下次进入 init() 走 s.lang 分支恢复英文，本函数仅在"全新访客"路径生效。
          return 'zh';
        },
        detectDark() {
          return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        },

        /* =========================================================
         * 国际化
         * ======================================================= */
        t(key, vars) {
          const path = key.split('.');
          let cur = window.i18n[this.lang];
          for (const p of path) {
            if (cur == null) return key;
            cur = cur[p];
          }
          if (cur == null) return key;
          if (vars && typeof cur === 'string') {
            return cur.replace(/\{(\w+)\}/g, (_, k) => vars[k] != null ? vars[k] : '');
          }
          return cur;
        },
        toggleLang() {
          this.lang = this.lang === 'zh' ? 'en' : 'zh';
          saveState({ lang: this.lang });
        },
        toggleDark() {
          this.darkMode = !this.darkMode;
          saveState({ darkMode: this.darkMode });
        },

        /* =========================================================
         * 路由
         * ======================================================= */
        go(page, params) {
          this.currentPage = page;
          this.pageParams  = params || {};
          // 拼 hash
          let hash = '#/' + page;
          if (params && Object.keys(params).length) {
            const qs = Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
            hash += '?' + qs;
          }
          if (window.location.hash !== hash) {
            history.pushState({ page, params }, '', hash);
          }
          // 特殊页初始化
          this.onPageEnter(page, params);
          window.scrollTo({ top: 0, behavior: 'instant' });
        },
        handleHash(fromPop) {
          const raw = window.location.hash.replace(/^#\/?/, '');
          if (!raw) { this.currentPage = 'home'; this.pageParams = {}; return; }
          const [pageRaw, qsRaw] = raw.split('?');
          const page = pageRaw || 'home';
          const params = {};
          if (qsRaw) qsRaw.split('&').forEach(p => {
            const [k, v] = p.split('='); if (k) params[k] = decodeURIComponent(v || '');
          });
          this.currentPage = page;
          this.pageParams = params;
          if (fromPop) this.onPageEnter(page, params);
        },
        onPageEnter(page, params) {
          // 离开排行榜：退订实时 + 关详情弹窗
          if (page !== 'ranking') { this.unsubscribeRanking(); this.rankingDetail = null; }
          if (page === 'type-detail' && params.code) {
            this.viewingTypeCode = params.code;
          }
          if (page === 'paywall' && params.tier) {
            this.setCode = params.tier;
          }
          if (page === 'intro' && params.tier) {
            this.setCode = params.tier;
          }
          if (page === 'result' && params.type && !this.result) {
            // 通过 URL 进入结果页（分享场景）：从 history 找
            const found = this.history.find(h => h.code === params.type);
            if (found) this.result = found;
          }
          if (page === 'about' && params.tab) {
            this.aboutTab = params.tab;
          }
          if (page === 'shared') {
            this.loadSharedReport(params.code);
          }
          if (page === 'me') {
            this.loadCloudReports();
          }
          if (page === 'ranking') {
            this.loadRanking();
            this.subscribeRanking();
          }
        },

        /* =========================================================
         * 测试流
         * ======================================================= */
        beginTest(setCode) {
          // campus40 单一免费测试，无付费墙
          this.setCode = setCode || 'campus55';
          this.go('intro', { tier: this.setCode });
        },
        startActualTest() {
          // 是否有未完成的测试？提示恢复
          const hasProgress = Object.keys(this.answers).length > 0 && this.currentQuestionIdx > 0;
          if (!hasProgress) {
            this.answers = {};
            this.currentQuestionIdx = 0;
            this.testStartedAt = Date.now();
          }
          this.currentQuestions = window.QUESTIONS[this.setCode];
          this.persistProgress();
          this.go('test');
        },
        get currentQuestion() {
          return this.currentQuestions[this.currentQuestionIdx];
        },
        get totalQuestions() {
          return this.currentQuestions.length;
        },
        get progressPct() {
          if (!this.totalQuestions) return 0;
          return Math.round(((this.currentQuestionIdx) / this.totalQuestions) * 100);
        },
        get currentAnswerValue() {
          const q = this.currentQuestion;
          if (!q) return null;
          return this.answers[q.id] ?? null;
        },
        answer(value) {
          const q = this.currentQuestion;
          if (!q) return;
          this.answers[q.id] = value;
          this.persistProgress();
          // 300ms 自动进入下一题
          setTimeout(() => {
            if (this.currentQuestionIdx < this.totalQuestions - 1) {
              this.currentQuestionIdx++;
              this.persistProgress();
            } else {
              this.finishTest();
            }
          }, 300);
        },
        prevQuestion() {
          if (this.currentQuestionIdx > 0) {
            this.currentQuestionIdx--;
            this.persistProgress();
          }
        },
        requestExitTest() {
          this.dialog = {
            open: true,
            message: this.t('test.exitConfirm'),
            onOk: () => { this.persistProgress(); this.go('home'); },
            onCancel: null
          };
        },
        persistProgress() {
          saveState({ testInProgress: {
            setCode: this.setCode,
            currentQuestionIdx: this.currentQuestionIdx,
            answers: this.answers,
            testStartedAt: this.testStartedAt
          }});
        },
        clearProgress() {
          const s = loadState() || {};
          delete s.testInProgress;
          localStorage.setItem(LS_KEY, JSON.stringify(s));
        },

        /* =========================================================
         * 完成测试 → 加载页 → 结果页
         * ======================================================= */
        finishTest() {
          this.go('loading');
          this.loadingPct = 0;
          this.loadingTipIdx = 0;
          const tipsLen = this.t('loading.tips').length;
          let tick = 0;
          const interval = setInterval(() => {
            tick++;
            this.loadingPct = Math.min(100, tick * 30);
            this.loadingTipIdx = (this.loadingTipIdx + 1) % tipsLen;
            if (tick >= 3) {
              clearInterval(interval);
              setTimeout(() => this.commitResult(), 400);
            }
          }, 1000);
        },
        commitResult() {
          const result = calculateMBTI(this.answers, this.setCode);
          this.result = result;
          // 写入本地历史
          const item = {
            ...result,
            id: 'r' + result.timestamp,
            durationSec: Math.round((Date.now() - this.testStartedAt) / 1000)
          };
          this.history.unshift(item);
          if (this.history.length > 50) this.history.length = 50;
          saveState({ history: this.history });
          this.clearProgress();
          this.activeTab = 'profile'; this.detailExpanded = false;
          this.go('result', { type: result.code });
          // 登录用户：异步存云端并生成分享码
          this.saveReportToCloud(result, item);
        },

        /* =========================================================
         * 类型 / 报告辅助
         * ======================================================= */
        typeData(code) {
          // 兼容 INFJ-A → INFJ
          const base = String(code || '').split('-')[0];
          return window.PERSONALITY_TYPES[base];
        },
        // 把"优势/盲点"单字符串按 ；/; 拆成条目（用于结果页列表展示）
        splitList(str) {
          return (str || '').split(/[；;]/).map(s => s.trim()).filter(Boolean);
        },

        /* ---------- 搭子标签 & 匹配 ---------- */
        buddyMainTag() {
          const base = (this.result && this.result.baseCode) || '';
          return window.BUDDY_TAGS[base] || null;
        },
        sceneTags() {
          const r = this.result;
          if (!r || !r.dimensions) return [];
          const d = r.dimensions;
          const sc = k => (d[k] ? d[k].score : 0);
          const e = sc('EI'), n = sc('SN'), t = sc('TF'), p = sc('JP'), a = sc('AT');
          const defs = [
            { key:'study',  s: (-p) + 0.5*(-n) },   // J + S
            { key:'meal',   s: e + 0.5*(-t) },       // E + F
            { key:'travel', s: p + 0.6*e },          // P + E
            { key:'vent',   s: (-e) + 0.7*(-t) },    // I + F
            { key:'hustle', s: t + 0.6*(-p) },       // T + J
            { key:'night',  s: p + 0.5*n },          // P + N
            { key:'sport',  s: e + 0.5*(-n) },        // E + S
            { key:'chill',  s: p + 0.6*(-a) }        // P + Turbulent
          ];
          defs.sort((x, y) => y.s - x.s);
          return defs.slice(0, 3).map(o => ({ key: o.key, ...window.SCENE_TAGS[o.key] }));
        },
        buddyMatches() {
          const base = (this.result && this.result.baseCode) || '';
          const m = window.BUDDY_MATCH[base];
          if (!m) return null;
          const resolve = (code) => {
            const tag = window.BUDDY_TAGS[code] || {};
            return { code, emoji: tag.emoji || '🙂', name: (tag[this.lang] || {}).name || code };
          };
          const reasonOf = (o) => this.lang === 'en' ? (o.enReason || o.zhReason) : o.zhReason;
          return {
            best: m.best.map(o => ({ ...resolve(o.code), reason: reasonOf(o) })),
            clash: { ...resolve(m.clash.code), reason: reasonOf(m.clash) }
          };
        },

        /* =========================================================
         * 报告查询 / 云端存储（Supabase reports 表）
         * ======================================================= */
        genShareCode() {
          // 8 位 base36 短码（运行时随机，前端用足够）
          let s = '';
          for (let i = 0; i < 8; i++) s += Math.floor(Math.random() * 36).toString(36);
          return s;
        },
        async saveReportToCloud(result, item) {
          if (!window.sb || !this.user) return;
          const code = this.genShareCode();
          const mainTag = window.BUDDY_TAGS[result.baseCode] || {};
          const buddyTag = (mainTag.zh || {}).name || '';
          const sceneKeys = this.sceneTags().map(s => s.key);
          try {
            const { data, error } = await window.sb.from('reports').insert({
              user_id: this.user.id,
              set_code: result.setCode,
              mbti_code: result.code,
              base_code: result.baseCode,
              buddy_main_tag: buddyTag,
              scene_tags: sceneKeys,
              dimensions: result.dimensions,
              answers: this.answers,
              share_code: code
            }).select().single();

        /* =========================================================
         * P3 AI 关系咨询 · 小满

        /**
         * 入口：从报告页 / 匹配页 / 个人中心点击进入 AI 对话页。
         * 自动校验解锁、注入首次问候、跳转。
         */
        openAiChat(fromContext) {
          // AI 不再设付费门槛：直接进聊天（worker 未配置时显示"AI 服务暂未配置"）
          this.aiContext = { from: fromContext };
          // 若历史为空，注入开场白

        scrollChatToBottom() {
          setTimeout(() => {
            const el = document.getElementById('chat-messages-area');
            if (el) el.scrollTop = el.scrollHeight;
          }, 50);
        },

        /**
         * 发送消息 + 流式接收 AI 响应。
         */
        async aiSend() {
          if (this.aiSending) return;
          const text = (this.aiInput || '').trim();
          if (!text) return;

          this.aiErrorMsg = '';
          this.aiMessages.push({ role: 'user', content: text, ts: Date.now() });
          this.aiInput = '';
          this.scrollChatToBottom();

          // 占位 assistant 消息（接收流式片段）
          const assistantIdx = this.aiMessages.length;
          this.aiMessages.push({ role: 'assistant', content: '', ts: Date.now(), streaming: true });
          this.aiSending = true;
          this.aiStreamingBuf = '';

          // 检查 Worker URL 是否被替换
          if (this.aiWorkerUrl.includes('your-account.workers.dev')) {
            this.aiMessages[assistantIdx].content = this.t('ai.workerNotConfigured');
            this.aiMessages[assistantIdx].streaming = false;
            this.aiSending = false;
            this.scrollChatToBottom();
            return;
          }

          // 准备 payload
          const payload = {
            code: this.aiUnlockCode || '',
            user: this.result ? {
              mbti: this.result.baseCode,
              dimensions: Object.fromEntries(Object.entries(this.result.dimensions || {}).map(([k, v]) => [k, v.score || v])),
              atSuffix: this.result.atSuffix
            } : { mbti: 'UNKNOWN' },
            partner: null,
            messages: this.aiMessages
              .filter((m, i) => i !== assistantIdx && !m.streaming)
              .map(m => ({ role: m.role, content: m.content }))
          };

          try {
            const resp = await fetch(this.aiWorkerUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (resp.status === 429) throw new Error('rate');
            if (resp.status === 403) throw new Error('unlock');
            if (!resp.ok) throw new Error('server');

            // 流式读取 SSE
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let sseBuf = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              sseBuf += decoder.decode(value, { stream: true });

              // 按行处理 SSE
              const lines = sseBuf.split('\n');
              sseBuf = lines.pop() || '';

              for (const line of lines) {
                if (!line.startsWith('data:')) continue;
                const payloadLine = line.slice(5).trim();
                if (payloadLine === '[DONE]') continue;
                if (!payloadLine) continue;
                try {
                  const obj = JSON.parse(payloadLine);
                  const delta = (obj.choices && obj.choices[0] && obj.choices[0].delta && obj.choices[0].delta.content) || '';
                  if (delta) {
                    this.aiMessages[assistantIdx].content += delta;
                    this.scrollChatToBottom();
                  }
                } catch (e) {
                  // SSE 行解析失败忽略
                }
              }
            }
          } catch (e) {
            const code = e.message;
            const errKey = code === 'rate' ? 'ai.errorRate'
                         : code === 'unlock' ? 'ai.errorUnlock'
                         : code === 'server' ? 'ai.errorGeneric'
                         : 'ai.errorNetwork';
            this.aiMessages[assistantIdx].content = this.t(errKey);
            this.aiErrorMsg = this.t(errKey);
          } finally {
            this.aiMessages[assistantIdx].streaming = false;
            this.aiSending = false;
            this.scrollChatToBottom();
            // 节流持久化（最近 50 条）
            saveState({ aiMessages: this.aiMessages.slice(-50) });
          }
        },

        async register() {
          const name = (this.regName || '').trim();
          if (name.length < 2 || name.length > 30) { this.showToast(this.t('auth.nameInvalid')); return; }
          if (!this.validPhone(this.regPhone)) { this.showToast(this.t('auth.phoneInvalid')); return; }
          const pw = this.regPassword || '';
          if (pw.length < 6 || pw.length > 20) { this.showToast(this.t('auth.pwInvalid')); return; }
          if (pw !== this.regConfirm) { this.showToast(this.t('auth.pwMismatch')); return; }
          if (!this.regAgree) { this.showToast(this.t('auth.mustAgree')); return; }
          if (!window.sb) { this.showToast(this.t('auth.loginUnavailable')); return; }
          this.authLoading = true;
          try {
            const fakeEmail = this.phoneToEmail(this.regPhone);
            // 1. 注册
            const { error: suErr } = await window.sb.auth.signUp({ email: fakeEmail, password: pw });
            if (suErr) {
              console.warn('[auth] signUp:', suErr);
              const taken = /registered|already|exists/i.test(suErr.message || '');
              this.showToast(taken ? this.t('auth.phoneExists') : (this.t('auth.registerFail') + '：' + suErr.message), 5000);
              return;
            }
            // 2. 主动登录拿到确定的 session —— 关键：保证写 profiles 时 auth.uid() 已就绪，绕开 RLS 时序问题
            const { data: siData, error: siErr } = await window.sb.auth.signInWithPassword({ email: fakeEmail, password: pw });
            if (siErr || !siData || !siData.session) {
              // 拿不到 session（绝大多数是后台 "Confirm email" 没关）→ 引导去登录
              console.warn('[auth] post-signup signIn:', siErr);
              this.showToast(this.t('auth.registerNeedConfirm'), 5000);
              this.authMode = 'login';
              this.authPhone = this.regPhone;
              return;
            }
            this._setUserFromSession(siData.session);
            // 3. 写档案（此刻 session 已确立，RLS with check (auth.uid()=id) 通过）
            const birth = (this.regBirthYear && this.regBirthMonth && this.regBirthDay)
              ? this.regBirthYear + '-' + String(this.regBirthMonth).padStart(2, '0') + '-' + String(this.regBirthDay).padStart(2, '0')
              : null;
            const pErr = await this._saveRegProfile(name, birth);
            if (pErr) {
              // 账号已建、已登录，但资料写入失败 → 明确告知（含原因），绝不静默
              this.showToast(this.t('auth.profileSaveFail') + (pErr.message ? '：' + pErr.message : ''), 5000);
            } else {
              this.showToast(this.t('auth.registerSuccess'));
            }
            this._clearAuthForms();
            this.go('me');
          } catch (e) {
            console.warn('[auth] register threw:', e);
            this.showToast(this.t('auth.registerFail'));
          } finally {
            this.authLoading = false;
          }
        },
        async _saveRegProfile(name, birth) {
          if (!window.sb || !this.user) return null;
          // upsert：行不存在则插入、存在则更新（不依赖建档触发器）。RLS：本人 insert/update 均允许。
          const { error } = await window.sb.from('profiles').upsert({
            id: this.user.id,
            phone: this.user.phone,   // profiles.phone 为 NOT NULL，insert 必须带真实手机号
            name: name || null,
            nickname: name || null,   // 默认昵称=姓名（排行榜显示用，用户可在「我的」修改）
            birth_date: birth,
            province: (this.regProvince || '').trim() || null,
            city: (this.regCity || '').trim() || null,
            updated_at: new Date().toISOString()
          }, { onConflict: 'id' });
          if (error) { console.warn('[profile] upsert failed:', error); return error; }
          this.profile.nickname = name;
          this.profile.province = (this.regProvince || '').trim();
          this.profile.city = (this.regCity || '').trim();
          return null;
        },
        /* ---- 登录（手机号 + 密码） ---- */
        async login() {
          if (!this.validPhone(this.authPhone)) { this.showToast(this.t('auth.phoneInvalid')); return; }
          if (!this.authPassword) { this.showToast(this.t('auth.pwRequired')); return; }
          if (!window.sb) { this.showToast(this.t('auth.loginUnavailable')); return; }
          this.authLoading = true;
          try {
            const { data, error } = await window.sb.auth.signInWithPassword({
              email: this.phoneToEmail(this.authPhone), password: this.authPassword
            });
            if (error || !data || !data.session) {
              console.warn('[auth] signInWithPassword:', error);
              this.showToast(this.t('auth.loginWrong')); return;
            }
            this._setUserFromSession(data.session);
            await this.loadMyProfile();
            this.showToast(this.t('auth.successLogin'));
            this._clearAuthForms();
            this.go('me');
          } catch (e) {
            console.warn('[auth] login threw:', e);
            this.showToast(this.t('auth.loginWrong'));
          } finally {
            this.authLoading = false;
          }
        },
        _clearAuthForms() {
          this.authPhone = ''; this.authPassword = '';
          this.regName = ''; this.regBirthYear = ''; this.regBirthMonth = ''; this.regBirthDay = '';
          this.regProvince = ''; this.regCity = ''; this.regPhone = ''; this.regPassword = ''; this.regConfirm = ''; this.regAgree = false;
        },
        logout() {
          this.dialog = {
            open: true,
            message: this.t('me.confirmLogout'),
            onOk: async () => {
              if (window.sb) { try { await window.sb.auth.signOut(); } catch (e) {} }
              this.user = null;
            },
            onCancel: null
          };
        },

        /* =========================================================
         * Toast / Dialog 辅助
         * ======================================================= */
        showToast(text, ms = 2000) {
          if (this.toast.timer) clearTimeout(this.toast.timer);
          this.toast.text = text;
          this.toast.timer = setTimeout(() => { this.toast.text = ''; }, ms);
        },
        copyText(text) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => this.showToast(this.t('common.copied')));
          } else {
            const ta = document.createElement('textarea');
            ta.value = text; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); this.showToast(this.t('common.copied')); }
            finally { ta.remove(); }
          }
        },

        /* =========================================================
         * 价格 / 题量 元数据（便于模板复用）
         * ======================================================= */
        tierMeta(code) {
          const len = window.QUESTIONS[code] ? window.QUESTIONS[code].length : 0;
          const META = {
            campus55:   { duration: 7,  free: true, price: 0 },
            campus122:  { duration: 17, free: true, price: 0 }
          };
          return { ...(META[code] || META.campus55), questions: len };
        },

        /* =========================================================
         * 分享系统：html2canvas 截取 #share-canvas → 下载或 Web Share
         * ======================================================= */
        async generateShareImage() {
          if (!this.result || this.sharing) return;
          if (typeof html2canvas !== 'function') {
            this.showToast(this.t('common.retry') + ' · html2canvas not loaded');
            return;
          }
          this.sharing = true;
          this.showToast(this.t('share.generating'));
          try {
            // 等待 Alpine 完成响应式渲染
            await new Promise(r => setTimeout(r, 50));
            const node = document.getElementById('share-canvas');
            if (!node) throw new Error('share-canvas not found');
            const canvas = await html2canvas(node, {
              width: 1080, height: 1920,
              scale: 1, backgroundColor: '#ffffff', useCORS: true, logging: false
            });
            // 尝试 Web Share API（移动端原生分享）
            if (navigator.share && navigator.canShare) {
              try {
                const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
                if (blob) {
                  const file = new File([blob], `mbti-${this.result.code}.png`, { type: 'image/png' });
                  if (navigator.canShare({ files: [file] })) {
                    await navigator.share({
                      files: [file],
                      title: this.t('share.title'),
                      text: `${this.result.code} · ${this.t('share.sub')}`
                    });
                    this.sharing = false; return;
                  }
                }
              } catch (e) { /* fallback to download below */ }
            }
            // 兜底：触发下载
            const dataUrl = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `mbti-${this.result.code}-${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            this.showToast(this.t('share.downloadTip'), 3000);
          } catch (e) {
            this.showToast((e && e.message) || 'Share failed');
            console.error('[share]', e);
          } finally {
            this.sharing = false;
          }
        }
      };
    }

    /* ============================ Helpers exposed globally ============================ */
    window.calculateMBTI    = calculateMBTI;
  </script>
</body>
